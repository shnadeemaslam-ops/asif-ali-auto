/* =========================================================================
   PART 10 — ADVANCE REPORTS
   Daily/Weekly(Mon–Sun)/Monthly, an SVG sale+profit trend chart, period-over-
   period comparison, best day, profit-by-category, and an "Advance" tab that
   drills Category -> Sub-Category -> Type -> Product/Service ranking.
   ========================================================================= */
let reportDate = todayStr();
let reportPeriod = 'daily';
let reportMonth = todayStr().slice(0,7);
let reportSubTab = 'overview';
let advanceSort = 'sale';
let advanceCategory = null;
let advancePartType = null;
let advanceSubPartType = null;
let reportSelectedSales = new Map(); // key: `${date}::${id}` -> {date,id}

function getReportBuckets(){
  // Built live from the current categories + service types, so a renamed
  // category shows up correctly instead of falling into "Other".
  const catBuckets = categories;
  const serviceBuckets = SERVICE_TYPES.filter(t=>t!=='Other Service');
  return [...catBuckets, ...serviceBuckets];
}
function getSaleCategory(s){
  if(s.category) return s.category;
  if(s.itemId){
    const it = items.find(i=>i.id===s.itemId);
    if(it) return it.category;
  }
  if(s.isService){
    for(const t of SERVICE_TYPES){
      if(s.name===t || s.name.endsWith('('+t+')')) return t;
    }
  }
  return 'Other';
}
// Returns the Monday (as YYYY-MM-DD) of the calendar week (Mon-Sun) that
// contains the given date string. Used so "weekly" reports always show a
// fixed Monday-to-Sunday range instead of a rolling 7-day window ending on
// whatever date the user happened to pick. Also avoids relying on
// <input type="week">, which iOS Safari doesn't support at all.
function getWeekStart(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay(); // 0=Sun,1=Mon,...6=Sat
  const diffToMonday = day===0 ? 6 : day-1;
  d.setDate(d.getDate()-diffToMonday);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDayMon(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.getDate()+' '+d.toLocaleString('en-US',{month:'short'});
}
function getReportDateRange(){
  if(reportPeriod==='weekly'){
    const monday = getWeekStart(reportDate);
    const dates = [];
    for(let i=0;i<7;i++){ const d=new Date(monday+'T00:00:00'); d.setDate(d.getDate()+i); dates.push(ymd(d)); }
    return dates;
  }
  if(reportPeriod==='monthly'){
    const [y,m] = reportMonth.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const dates = [];
    for(let d=1; d<=daysInMonth; d++){
      dates.push(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
    }
    return dates;
  }
  return [reportDate];
}
async function fetchReportSales(){
  const dates = getReportDateRange();
  const arrays = await Promise.all(dates.map(async d=>{
    const arr = await loadSales(d);
    return arr.map(s=>({...s, _date: d}));
  }));
  const flat = arrays.flat();
  flat.sort((a,b)=> b._date.localeCompare(a._date));
  return flat;
}

/* ---- Trend graph + period comparison ---- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getLast7Dates(endDate){
  const end = new Date(endDate+'T00:00:00');
  const dates = [];
  for(let i=6;i>=0;i--){ const d=new Date(end); d.setDate(d.getDate()-i); dates.push(ymd(d)); }
  return dates;
}
function getPrevPeriodDates(){
  if(reportPeriod==='daily'){
    const d = new Date(reportDate+'T00:00:00'); d.setDate(d.getDate()-1);
    return [ymd(d)];
  }
  if(reportPeriod==='weekly'){
    const monday = new Date(getWeekStart(reportDate)+'T00:00:00');
    const prevMonday = new Date(monday); prevMonday.setDate(prevMonday.getDate()-7);
    // Fair comparison: if this week is still in progress, only compare against the
    // SAME number of days from last week — not last week's full 7 days.
    const limitDays = daysElapsedInWeek(reportDate);
    const dates = [];
    for(let i=0;i<limitDays;i++){ const d=new Date(prevMonday); d.setDate(d.getDate()+i); dates.push(ymd(d)); }
    return dates;
  }
  let [y,m] = reportMonth.split('-').map(Number);
  m -= 1; if(m===0){ m=12; y-=1; }
  const daysInMonth = new Date(y,m,0).getDate();
  // Fair comparison: if the report month is still in progress (i.e. it's the current
  // month), only compare against the SAME number of days from last month — not last
  // month's full total. e.g. if today is the 5th, compare this month's 5 days against
  // only the 1st-5th of last month, not the whole of last month.
  const curMonthStr = todayStr().slice(0,7);
  let limitDays = daysInMonth;
  if(reportMonth === curMonthStr){
    const elapsedDays = parseInt(todayStr().slice(8,10),10);
    limitDays = Math.min(daysInMonth, elapsedDays);
  }
  const dates = [];
  for(let d=1; d<=limitDays; d++) dates.push(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
  return dates;
}
async function fetchTotalsForDates(dates){
  const arrays = await Promise.all(dates.map(d=>loadSales(d)));
  let sale=0, profit=0;
  arrays.forEach(arr=>{ arr.forEach(s=>{ sale+=s.totalSell; profit+=s.totalProfit; }); });
  return {sale, profit};
}
function buildDateTotals(salesFlat, dates){
  const map = {};
  salesFlat.forEach(s=>{
    if(!map[s._date]) map[s._date] = {date:s._date, sale:0, profit:0};
    map[s._date].sale += s.totalSell;
    map[s._date].profit += s.totalProfit;
  });
  return dates.map(d=> map[d] || {date:d, sale:0, profit:0});
}
function daysElapsedInMonth(monthStr){
  // For averages: past months use their full day count, but the current
  // (in-progress) month should only be divided by days that have actually
  // occurred so far, not the whole month.
  const [y,m] = monthStr.split('-').map(Number);
  const daysInMonth = new Date(y,m,0).getDate();
  const curMonthStr = todayStr().slice(0,7);
  if(monthStr === curMonthStr) return Math.min(daysInMonth, parseInt(todayStr().slice(8,10),10));
  return daysInMonth;
}
function daysElapsedInWeek(dateStr){
  // Same idea as daysElapsedInMonth, but for the current (in-progress) week: past
  // weeks use the full 7 days, but this week only counts Monday through today.
  const monday = getWeekStart(dateStr);
  const curMonday = getWeekStart(todayStr());
  if(monday === curMonday){
    const mondayDate = new Date(monday+'T00:00:00');
    const todayDate = new Date(todayStr()+'T00:00:00');
    const diffDays = Math.round((todayDate - mondayDate)/86400000) + 1;
    return Math.min(7, Math.max(1, diffDays));
  }
  return 7;
}
function pctChangeText(cur, prev){
  if(prev===0){ return cur>0 ? {text:'▲ New', color:'var(--green)'} : {text:'—', color:'var(--muted)'}; }
  const pct = Math.round(((cur-prev)/prev)*100);
  if(pct>0) return {text:`▲ ${pct}%`, color:'var(--green)'};
  if(pct<0) return {text:`▼ ${Math.abs(pct)}%`, color:'var(--red)'};
  return {text:'– 0%', color:'var(--muted)'};
}
function renderTrendChartSVG(dateTotals){
  const n = dateTotals.length;
  if(n===0) return '<div class="empty" style="padding:20px;">No data</div>';
  const maxVal = Math.max(1, ...dateTotals.map(d=>Math.max(d.sale, d.profit)));
  const barW = n>15 ? 8 : (n>7 ? 16 : 28);
  const gap = n>15 ? 5 : (n>7 ? 10 : 16);
  const chartH = 110;
  const groupW = barW*2 + 3;
  const step = groupW + gap;
  const totalW = n*step + 10;
  const labelEvery = n>15 ? Math.ceil(n/8) : 1;
  let bars='', profitBars='', labels='';
  dateTotals.forEach((d,i)=>{
    const x = 6 + i*step;
    const saleH = Math.max(d.sale>0?2:0, Math.round((d.sale/maxVal)*chartH));
    const profitH = Math.max(d.profit>0?2:0, Math.round((d.profit/maxVal)*chartH));
    bars += `<rect x="${x}" y="${chartH-saleH}" width="${barW}" height="${saleH}" rx="2" style="fill:var(--accent)"></rect>`;
    profitBars += `<rect x="${x+barW+3}" y="${chartH-profitH}" width="${barW}" height="${profitH}" rx="2" style="fill:var(--green)"></rect>`;
    if(i%labelEvery===0 || i===n-1){
      const lbl = n>7 ? String(parseInt(d.date.slice(8,10),10)) : d.date.slice(5).replace('-','/');
      labels += `<text x="${x+groupW/2}" y="${chartH+15}" font-size="9" style="fill:var(--muted)" text-anchor="middle">${lbl}</text>`;
    }
  });
  return `<div style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
    <svg width="${totalW}" height="${chartH+28}" style="display:block; margin:0 auto; min-width:100%;">
      ${bars}
      <g id="trendProfitBars" style="filter:${profitVisible?'none':'blur(6px)'}; transition:filter .2s;">${profitBars}</g>
      ${labels}
    </svg>
  </div>
  <div style="display:flex; justify-content:center; gap:18px; margin-top:8px; font-size:11px; color:var(--muted);">
    <div style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:2px; background:var(--accent); display:inline-block;"></span>Sale</div>
    <div style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:2px; background:var(--green); display:inline-block;"></span>Profit</div>
  </div>`;
}
async function renderTrendSection(sales, totalSale, totalProfit){
  let dateTotals, prevTotals, periodWord;
  if(reportPeriod==='daily'){
    const last7 = getLast7Dates(reportDate);
    const arrays = await Promise.all(last7.map(async d=>{ const arr = await loadSales(d); return arr.map(s=>({...s,_date:d})); }));
    dateTotals = buildDateTotals(arrays.flat(), last7);
    periodWord = 'Day';
  } else {
    const dates = getReportDateRange();
    dateTotals = buildDateTotals(sales, dates);
    periodWord = reportPeriod==='weekly' ? 'Week' : 'Month';
  }
  prevTotals = await fetchTotalsForDates(getPrevPeriodDates());
  const daysWithRange = reportPeriod==='monthly' ? Math.max(1, daysElapsedInMonth(reportMonth)) : (reportPeriod==='weekly' ? Math.max(1, daysElapsedInWeek(reportDate)) : dateTotals.length);
  const avgBasisSale = reportPeriod==='daily' ? dateTotals.reduce((s,d)=>s+d.sale,0) : totalSale;
  const avgBasisProfit = reportPeriod==='daily' ? dateTotals.reduce((s,d)=>s+d.profit,0) : totalProfit;
  const avgSale = avgBasisSale / daysWithRange;
  const avgProfit = avgBasisProfit / daysWithRange;
  const bestDay = dateTotals.reduce((best,d)=> (!best || d.sale>best.sale) ? d : best, null);
  const saleChange = pctChangeText(totalSale, prevTotals.sale);
  const profitChange = pctChangeText(totalProfit, prevTotals.profit);
  const avgLabelSuffix = reportPeriod==='daily' ? ' (Last 7 Days)' : '';
  // When the current week/month is still in progress, make it explicit that the "vs
  // Previous Week/Month" row is comparing the same number of days on both sides —
  // otherwise "3 days vs whole last week/month" reads as a full-period comparison.
  let compareSuffix = '';
  if(reportPeriod==='monthly'){
    const curMonthStr = todayStr().slice(0,7);
    if(reportMonth === curMonthStr){
      const elapsedDays = parseInt(todayStr().slice(8,10),10);
      compareSuffix = ` (first ${elapsedDays} day${elapsedDays===1?'':'s'} of each)`;
    }
  } else if(reportPeriod==='weekly'){
    const curMonday = getWeekStart(todayStr());
    if(getWeekStart(reportDate) === curMonday){
      const elapsedDays = daysElapsedInWeek(reportDate);
      compareSuffix = ` (first ${elapsedDays} day${elapsedDays===1?'':'s'} of each)`;
    }
  }
  return `
    <div class="section-title">Sales & Profit Trend</div>
    <div class="card" style="padding:14px 8px 10px;">
      ${renderTrendChartSVG(dateTotals)}
    </div>
    <div class="card">
      <div class="sale-list-item"><div>Avg Daily Sale${avgLabelSuffix}</div><div class="t" style="font-weight:600; font-family:'JetBrains Mono',monospace;">${fmtMoney(avgSale)}</div></div>
      <div class="sale-list-item"><div>Avg Daily Profit${avgLabelSuffix}</div><div class="t profit-val" data-amt="${avgProfit}" style="color:var(--green); cursor:pointer; font-weight:600; font-family:'JetBrains Mono',monospace;" onclick="toggleProfitValue()">${profitVisible?fmtMoney(avgProfit):'••••'}</div></div>
      <div class="sale-list-item"><div>Best Day</div><div class="t" style="font-weight:600;">${bestDay && bestDay.sale>0 ? bestDay.date+' · '+fmtMoney(bestDay.sale) : '—'}</div></div>
      <div class="sale-list-item"><div>Sale vs Previous ${periodWord}${compareSuffix}</div><div class="t" style="font-weight:600; color:${saleChange.color};">${saleChange.text}</div></div>
      <div class="sale-list-item"><div>Profit vs Previous ${periodWord}${compareSuffix}</div><div class="t" style="font-weight:600; color:${profitChange.color};">${profitChange.text}</div></div>
    </div>`;
}
function renderCategoryBreakdown(sales){
  const totals = {};
  sales.forEach(s=>{
    const cat = getSaleCategory(s);
    totals[cat] = (totals[cat]||0) + s.totalProfit;
  });
  const buckets = getReportBuckets();
  let html = '<div class="card">';
  buckets.forEach(cat=>{
    const amt = totals[cat]||0;
    html += `<div class="sale-list-item"><div>${cat}</div><div class="t profit-val" data-amt="${amt}" style="color:var(--green); cursor:pointer; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;" onclick="toggleProfitValue()">${profitVisible?'+'+fmtMoney(amt):'••••'}</div></div>`;
  });
  const otherAmt = Object.keys(totals).filter(k=>!buckets.includes(k)).reduce((s,k)=>s+totals[k],0);
  if(otherAmt!==0){
    html += `<div class="sale-list-item"><div>Other</div><div class="t profit-val" data-amt="${otherAmt}" style="color:var(--green); cursor:pointer; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;" onclick="toggleProfitValue()">${profitVisible?'+'+fmtMoney(otherAmt):'••••'}</div></div>`;
  }
  html += '</div>';
  return html;
}

/* ---- Advance tab: drill-down ranking (Category -> Sub-Category -> Type -> Product/Service) ---- */
function getSalePartType(s){
  if(s.isService) return s.serviceSubType || null;
  if(s.itemId){ const it = items.find(i=>i.id===s.itemId); if(it) return it.partType || null; }
  return null;
}
function getSaleSubPartType(s){
  if(s.itemId){ const it = items.find(i=>i.id===s.itemId); if(it) return it.subPartType || null; }
  return null;
}
function getAdvanceFilteredSales(sales){
  let filtered = sales;
  if(advanceCategory) filtered = filtered.filter(s=>getSaleCategory(s)===advanceCategory);
  if(advancePartType) filtered = filtered.filter(s=>getSalePartType(s)===advancePartType);
  if(advanceSubPartType) filtered = filtered.filter(s=>getSaleSubPartType(s)===advanceSubPartType);
  return filtered;
}
function getAdvanceLevel(filtered){
  if(!advanceCategory) return 'category';
  if(!advancePartType) return filtered.some(s=>getSalePartType(s)) ? 'partType' : 'product';
  if(!advanceSubPartType) return filtered.some(s=>getSaleSubPartType(s)) ? 'subPartType' : 'product';
  return 'product';
}
function groupAdvanceSales(filtered, level){
  const map = {};
  filtered.forEach(s=>{
    let key, name;
    if(level==='category'){ key = getSaleCategory(s); name = key; }
    else if(level==='partType'){ key = getSalePartType(s) || 'Other'; name = key; }
    else if(level==='subPartType'){ key = getSaleSubPartType(s) || 'Other'; name = key; }
    else { key = s.itemId ? ('item::'+s.itemId) : ('name::'+s.name); name = s.name; }
    if(!map[key]) map[key] = { key, name, qty:0, sale:0, profit:0 };
    map[key].qty += (s.qty||0);
    map[key].sale += s.totalSell;
    map[key].profit += s.totalProfit;
  });
  return Object.values(map);
}
function renderAdvanceBody(sales){
  const filtered = getAdvanceFilteredSales(sales);
  const level = getAdvanceLevel(filtered);
  const groups = groupAdvanceSales(filtered, level);

  let crumbs = `<span onclick="breadcrumbAdvance('root')" style="cursor:pointer; ${!advanceCategory?'color:var(--text); font-weight:600;':'color:var(--accent);'}">All Categories</span>`;
  if(advanceCategory) crumbs += ` <span style="color:var(--muted)">›</span> <span onclick="breadcrumbAdvance('category')" style="cursor:pointer; ${!advancePartType?'color:var(--text); font-weight:600;':'color:var(--accent);'}">${advanceCategory}</span>`;
  if(advancePartType) crumbs += ` <span style="color:var(--muted)">›</span> <span onclick="breadcrumbAdvance('partType')" style="cursor:pointer; ${!advanceSubPartType?'color:var(--text); font-weight:600;':'color:var(--accent);'}">${advancePartType}</span>`;
  if(advanceSubPartType) crumbs += ` <span style="color:var(--muted)">›</span> <span style="color:var(--text); font-weight:600;">${advanceSubPartType}</span>`;

  const titleMap = { category:'Category Ranking', partType:'Sub-Category Ranking', subPartType:'Sub-Category Ranking', product:'Product / Service Ranking' };

  if(groups.length===0){
    return `<div style="font-size:12.5px; margin-bottom:10px;">${crumbs}</div><div class="section-title">${titleMap[level]}</div><div class="empty">No sales in this period.</div>`;
  }
  const sorted = [...groups].sort((a,b)=>{
    if(advanceSort==='profit') return b.profit-a.profit;
    if(advanceSort==='qty') return b.qty-a.qty;
    return b.sale-a.sale;
  });
  const medal = ['🥇','🥈','🥉'];
  let html = `
    <div style="font-size:12.5px; margin-bottom:10px; line-height:1.6;">${crumbs}</div>
    <div class="section-title" style="display:flex; align-items:center; justify-content:space-between;">
      <span>${titleMap[level]}</span>
    </div>
    <div class="chips" style="margin-bottom:10px;">
      <div class="chip ${advanceSort==='sale'?'active':''}" onclick="setAdvanceSort('sale')">By Sale</div>
      <div class="chip ${advanceSort==='profit'?'active':''}" onclick="setAdvanceSort('profit')">By Profit</div>
      <div class="chip ${advanceSort==='qty'?'active':''}" onclick="setAdvanceSort('qty')">By Qty</div>
    </div>
    <div class="card">`;
  sorted.forEach((c,i)=>{
    const rank = i<3 ? medal[i] : (i+1);
    const heroTag = (level==='product' && i===0) ? '<span class="badge ok" style="padding:2px 7px; font-size:10px; margin-left:6px;">🦸 Hero</span>' : '';
    const clickable = level!=='product';
    const rowAttrs = clickable ? `style="cursor:pointer;" onclick="drillAdvance('${level}','${c.name.replace(/'/g,"\\'")}')"` : '';
    const chevron = clickable ? '<span style="color:var(--muted); margin-left:6px;">›</span>' : '';
    html += `<div class="sale-list-item" ${rowAttrs}>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:26px; text-align:center; font-size:${i<3?'16px':'12px'}; color:var(--muted); font-weight:600;">${rank}</div>
        <div><div style="font-weight:600;">${c.name}${heroTag}</div><div class="t">Qty Sold: ${c.qty}</div></div>
      </div>
      <div style="text-align:right; display:flex; align-items:center; gap:2px;">
        <div>
          <div><b>${fmtMoney(c.sale)}</b></div>
          <div class="t profit-val" data-amt="${c.profit}" style="color:var(--green); cursor:pointer" onclick="event.stopPropagation(); toggleProfitValue()">${profitVisible ? '+'+fmtMoney(c.profit) : '••••'}</div>
        </div>
        ${chevron}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

/* ---------------- REPORT SEARCH (cross-date, all history) ---------------- */
let reportSearchQuery = '';
function setReportSearch(v){ reportSearchQuery = v; renderReport(); }
function clearReportSearch(){ reportSearchQuery = ''; renderReport(); }
async function performReportSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  let matches = [];
  try{
    const allDocs = await idbGetAll('sales');
    allDocs.forEach(doc=>{
      const arr = doc.list || [];
      arr.forEach(s=>{
        const nameMatch = (s.name||'').toLowerCase().includes(q);
        const custMatch = (s.customerName||'').toLowerCase().includes(q);
        if(nameMatch || custMatch) matches.push({...s, _date: doc.date});
      });
    });
  }catch(e){ console.error(e); }
  matches.sort((a,b)=> b._date.localeCompare(a._date) || (b.time||'').localeCompare(a.time||''));
  return matches;
}
function reportSearchBarHtml(){
  return `
    <div class="card" style="margin-bottom:14px;">
      <label>🔍 Search Old Sales (by item/service name or customer)</label>
      <div style="display:flex; gap:8px;">
        <input id="reportSearchInput" placeholder="e.g. Type-C Charger, or Ahmed Bhai" value="${reportSearchQuery}" oninput="setReportSearch(this.value)" style="margin-bottom:0; flex:1;">
        ${reportSearchQuery ? `<button type="button" onclick="clearReportSearch()" style="padding:0 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:inherit;cursor:pointer;">✕</button>` : ''}
      </div>
    </div>`;
}
async function renderReportSearchResults(){
  const el = document.getElementById('reportSearchResultsBody');
  if(!el) return;
  el.innerHTML = `<div class="empty">Searching...</div>`;
  const matches = await performReportSearch(reportSearchQuery);
  if(matches.length===0){
    el.innerHTML = `<div class="empty">No past sale found for "${reportSearchQuery}"</div>`;
    return;
  }
  const totalAmt = matches.reduce((s,m)=>s+m.totalSell,0);
  el.innerHTML = `
    <div style="color:var(--muted); font-size:12.5px; margin-bottom:10px;">${matches.length} result(s) found · Total value: ${fmtMoney(totalAmt)}</div>
    ${matches.map(s=>`
      <div class="sale-list-item" onclick="openInvoiceModal('${s._date}','${s.id}')" style="cursor:pointer;">
        <div>
          <div>${s.name} × ${s.qty} ${s.customerName ? '· '+s.customerName : ''}</div>
          <div class="t">${s._date} · ${s.time||''}${s.isService?' · Service':''}</div>
        </div>
        <div style="text-align:right"><b>${fmtMoney(s.totalSell)}</b></div>
      </div>
    `).join('')}`;
}
async function renderReport(){
  const searchBarHtml = reportSearchBarHtml();
  if(reportSearchQuery.trim()){
    document.getElementById('view').innerHTML = `
      ${searchBarHtml}
      <div id="reportSearchResultsBody"></div>
    `;
    const inp = document.getElementById('reportSearchInput');
    inp.focus();
    inp.selectionStart = inp.selectionEnd = reportSearchQuery.length;
    await renderReportSearchResults();
    return;
  }
  let pickerHtml = '';
  if(reportPeriod==='daily'){
    pickerHtml = `<label>Select Date</label><input type="date" id="reportDateInput" value="${reportDate}" max="${todayStr()}">`;
  } else if(reportPeriod==='weekly'){
    const wkMonday = getWeekStart(reportDate);
    const wkSunday = (()=>{ const d=new Date(wkMonday+'T00:00:00'); d.setDate(d.getDate()+6); return ymd(d); })();
    const nextDisabled = wkSunday >= todayStr() ? 'disabled style="opacity:.4;cursor:not-allowed;"' : '';
    pickerHtml = `
      <label>Week (Mon - Sun)</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <button type="button" class="secondary" style="padding:8px 14px; flex-shrink:0;" onclick="shiftReportWeek(-1)">◀ Prev</button>
        <div style="flex:1; text-align:center; font-weight:600;">${fmtDayMon(wkMonday)} - ${fmtDayMon(wkSunday)}</div>
        <button type="button" class="secondary" style="padding:8px 14px; flex-shrink:0;" onclick="shiftReportWeek(1)" ${nextDisabled}>Next ▶</button>
      </div>
      <input type="date" id="reportDateInput" value="${reportDate}" max="${todayStr()}" style="margin-top:8px;">`;
  } else {
    pickerHtml = `<label>Select Month</label><input type="month" id="reportMonthInput" value="${reportMonth}" max="${todayStr().slice(0,7)}">`;
  }
  document.getElementById('view').innerHTML = `
    ${searchBarHtml}
    <div class="chips">
      <div class="chip ${reportPeriod==='daily'?'active':''}" onclick="setReportPeriod('daily')">Daily</div>
      <div class="chip ${reportPeriod==='weekly'?'active':''}" onclick="setReportPeriod('weekly')">Weekly</div>
      <div class="chip ${reportPeriod==='monthly'?'active':''}" onclick="setReportPeriod('monthly')">Monthly</div>
    </div>
    ${pickerHtml}
    <div id="reportBody"></div>
  `;
  if(reportPeriod==='monthly'){
    document.getElementById('reportMonthInput').addEventListener('change', e=>{
      reportMonth = e.target.value; renderReportBody();
    });
  } else {
    document.getElementById('reportDateInput').addEventListener('change', e=>{
      reportDate = reportPeriod==='weekly' ? getWeekStart(e.target.value) : e.target.value;
      renderReport();
    });
  }
  await renderReportBody();
}
function setReportPeriod(p){ reportPeriod = p; renderReport(); }
function shiftReportWeek(dir){
  const d = new Date(getWeekStart(reportDate)+'T00:00:00');
  d.setDate(d.getDate() + dir*7);
  const newMonday = ymd(d);
  if(newMonday > todayStr()) return; // don't allow navigating into the future
  reportDate = newMonday;
  renderReport();
}
function setReportSubTab(t){ reportSubTab = t; if(t==='advance'){ advanceCategory=null; advancePartType=null; advanceSubPartType=null; } renderReportBody(); }
function setAdvanceSort(s){ advanceSort = s; renderReportBody(); }
function drillAdvance(level, name){
  if(level==='category'){ advanceCategory = name; advancePartType = null; advanceSubPartType = null; }
  else if(level==='partType'){ advancePartType = name; advanceSubPartType = null; }
  else if(level==='subPartType'){ advanceSubPartType = name; }
  renderReportBody();
}
function breadcrumbAdvance(toLevel){
  if(toLevel==='root'){ advanceCategory=null; advancePartType=null; advanceSubPartType=null; }
  else if(toLevel==='category'){ advancePartType=null; advanceSubPartType=null; }
  else if(toLevel==='partType'){ advanceSubPartType=null; }
  renderReportBody();
}

async function generateReportMultiInvoice(action){
  action = action || 'print';
  const customerName = document.getElementById('inv_customer_name').value.trim();
  const customerMobile = document.getElementById('inv_customer_mobile').value.trim();
  const discount = parseFloat(document.getElementById('inv_discount')?.value)||0;

  if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
  const invoiceNumber = settings.nextInvoiceNumber;
  settings.nextInvoiceNumber += 1;
  await saveSettings();

  let customerId = null;
  if(customerName) customerId = await findOrCreateCustomer(customerName, customerMobile);

  // group selected entries by date so we only load/save each date's sales once
  const byDate = {};
  reportSelectedSales.forEach(({date, id})=>{
    if(!byDate[date]) byDate[date] = [];
    byDate[date].push(id);
  });

  const combinedLineItems = [];
  const combinedSaleRefs = [];
  const dateSalesPairs = [];
  const dates = Object.keys(byDate).sort();
  for(const dateStr of dates){
    const sales = await loadSales(dateStr);
    const ids = byDate[dateStr];
    sales.forEach(s=>{
      if(ids.includes(s.id)){
        s.invoiceNumber = invoiceNumber;
        if(customerName) s.customerName = customerName;
        if(customerMobile) s.customerMobile = customerMobile;
        combinedLineItems.push(s);
        combinedSaleRefs.push({date: dateStr, id: s.id});
      }
    });
    dateSalesPairs.push({dateStr, sales});
  }

  const originalLineItems = combinedLineItems.map(s=>({...s})); // snapshot for invoice display
  applyInvoiceDiscount(combinedLineItems, discount);
  for(const {dateStr, sales} of dateSalesPairs){
    await saveSales(dateStr, sales);
  }

  const displayDate = dates.length===1 ? dates[0] : `${dates[0]} to ${dates[dates.length-1]}`;
  const subtotal = originalLineItems.reduce((sum,li)=>sum+li.totalSell, 0);
  await saveInvoiceRecord({
    invoiceNumber, date: displayDate,
    customerName: customerName||'', customerMobile: customerMobile||'', customerId,
    items: originalLineItems, subtotal, discount, grandTotal: subtotal-discount,
    saleRefs: combinedSaleRefs, createdAt: new Date().toISOString()
  });

  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();

  if(action==='whatsapp'){
    sendInvoiceViaWhatsApp(invoiceNumber, displayDate, customerMobile, originalLineItems, discount);
  } else if(action==='shareimage'){
    shareInvoiceAsImage(invoiceNumber, displayDate, customerName, customerMobile, originalLineItems, discount);
  } else {
    printInvoice(invoiceNumber, displayDate, customerName, customerMobile, originalLineItems, discount);
  }
  reportSelectedSales.clear();
  await renderReportBody();
}

}

async function saveCreditEntry(existingId){
  const customer = document.getElementById('cr_customer').value.trim();
  const description = document.getElementById('cr_desc').value.trim();
  const amount = parseFloat(document.getElementById('cr_amount').value)||0;
  if(!customer){ showToast('Customer name is required'); return; }
  if(amount<=0){ showToast('Amount is required'); return; }
  if(existingId){
    const c = creditEntries.find(x=>x.id===existingId);
    if(c){
      c.customer = customer;
      c.description = description;
      c.amount = amount;
      const paidAmt = getCreditPaidAmount(c);
      if(paidAmt>=amount){ c.paid = true; if(!c.paidDate) c.paidDate = todayStr(); }
      else { c.paid = false; c.paidDate = null; }
    }
  } else {
    await findOrCreateCustomer(customer, '');
    creditEntries.push({id:uid(), customer, description, amount, paid:false, date:todayStr(), paidDate:null, payments:[]});
  }
  await saveCredit();
  document.querySelector('.modal-overlay').remove();
  showToast(existingId ? 'Credit entry updated' : 'Credit entry added');
  renderCredit();
}

async function submitCreditPayment(id){
  const c = creditEntries.find(x=>x.id===id);
  if(!c) return;
  const amount = parseFloat(document.getElementById('cr_payment_amount').value)||0;
  if(amount<=0){ showToast('Enter a valid amount'); return; }
  if(!c.payments) c.payments = [];
  c.payments.push({amount, date: todayStr()});
  const paidAmt = getCreditPaidAmount(c);
  if(paidAmt >= c.amount){
    c.paid = true;
    c.paidDate = todayStr();
  }
  await saveCredit();
  document.querySelector('.modal-overlay').remove();
  showToast('Payment added ✓');
  renderCredit();

async function saveShoppingCategoryRename(idx){
  const input = document.getElementById('sh_cat_edit_'+idx);
  const newVal = input.value.trim();
  if(!newVal){ showToast('Name cannot be empty'); return; }
  const oldVal = shoppingCategories[idx];
  if(newVal!==oldVal){
    shoppingCategories[idx] = newVal;
    shoppingList.forEach(s=>{ if(s.category===oldVal) s.category = newVal; });
    await saveShoppingCategories();
    await saveShopping();
    if(shoppingCategoryFilter===oldVal) shoppingCategoryFilter=newVal;
    showToast('Category updated ✓');
  }
  if(document.getElementById('sh_cat')) populateShoppingCategorySelect(newVal);
  renderManageShoppingCategoriesModal();
}
async function deleteShoppingCategoryEntry(idx){
  const removedName = shoppingCategories[idx];
  shoppingCategories.splice(idx,1);
  await saveShoppingCategories();
  showToast('Category deleted');
  if(document.getElementById('sh_cat')) populateShoppingCategorySelect();
  if(shoppingCategoryFilter===removedName) shoppingCategoryFilter='all';
  renderManageShoppingCategoriesModal();
}
async function saveShoppingItem(existingId){
  const itemName = document.getElementById('sh_item').value.trim();
  const catSel = document.getElementById('sh_cat');
  const category = (catSel && catSel.value && catSel.value!=='__add_new__') ? catSel.value : '';
  const customer = document.getElementById('sh_customer').value.trim();
  const customerPhone = document.getElementById('sh_customer_phone').value.trim();
  if(!itemName){ showToast('Item name is required'); return; }
  if(customer) await findOrCreateCustomer(customer, customerPhone);
  if(existingId){
    const s = shoppingList.find(x=>x.id===existingId);
    if(s){ s.itemName = itemName; s.category = category; s.customer = customer; s.customerPhone = customerPhone; }
  } else {
    shoppingList.push({id:uid(), itemName, category, customer, customerPhone, bought:false, date:todayStr(), boughtDate:null});
  }
  await saveShopping();
  document.querySelector('.modal-overlay').remove();
  showToast(existingId ? 'Shopping list item updated' : 'Added to shopping list');
  renderShopping();
}
async function markShoppingBought(id){
  const s = shoppingList.find(x=>x.id===id);
  if(s){ s.bought = true; s.boughtDate = todayStr(); await saveShopping(); showToast('Marked as bought ✓'); renderShopping(); }
}
async function deleteShoppingItem(id){
  shoppingList = shoppingList.filter(x=>x.id!==id);
  await saveShopping();
  showToast('Item removed');
  renderShopping();
}

/* =========================================================================
   PART 9 — EXPENSES
   Daily/Weekly/Monthly/All-Time filtering. Weekly uses a plain date picker
   (not <input type="week">, which iOS Safari doesn't support at all) — same
   fix used in Part 10's Reports.
   ========================================================================= */

let expenseFilter = 'all';
let expensePeriod = 'all';
let expenseReportDate = todayStr();
let expenseReportMonth = todayStr().slice(0,7);
const EXPENSE_CATEGORIES = ['Daily Expense','Shop Expense'];
function getExpenseDateRange(){
  if(expensePeriod==='weekly'){
    const end = new Date(expenseReportDate+'T00:00:00');
    const dates = [];
    for(let i=6;i>=0;i--){
      const d = new Date(end);
      d.setDate(d.getDate()-i);
      dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    }
    return dates;
  }
  if(expensePeriod==='daily') return [expenseReportDate];
  return null;
}
async function renderExpense(){
  let list = expenseEntries;
  if(expenseFilter!=='all') list = list.filter(e=>e.category===expenseFilter);
  if(expensePeriod==='daily' || expensePeriod==='weekly'){
    const range = getExpenseDateRange();
    list = list.filter(e=>range.includes(e.date));
  } else if(expensePeriod==='monthly'){
    list = list.filter(e=>e.date && e.date.startsWith(expenseReportMonth));
  }
  list = list.slice().reverse();
  const totalFiltered = list.reduce((s,e)=>s+e.amount,0);

  const catLabel = expenseFilter!=='all' ? ` — ${expenseFilter}` : '';
  const periodLabel = expensePeriod==='daily' ? ` (${expenseReportDate})` : expensePeriod==='weekly' ? ` (7 days ending ${expenseReportDate})` : expensePeriod==='monthly' ? ` (${expenseReportMonth})` : '';

  let pickerHtml = '';
  if(expensePeriod==='daily' || expensePeriod==='weekly'){
    pickerHtml = `<input type="date" id="expenseDateInput" value="${expenseReportDate}" max="${todayStr()}">`;
  } else if(expensePeriod==='monthly'){
    pickerHtml = `<input type="month" id="expenseMonthInput" value="${expenseReportMonth}" max="${todayStr().slice(0,7)}">`;
  }

  let html = `
    <button class="secondary" style="margin-bottom:14px" onclick="switchView('more')">← Back</button>
    <div class="register">
      <div class="reg-cell sale" onclick="togglePrices()" style="cursor:pointer">
        <div class="lbl">Total Expenses${catLabel}${periodLabel}</div>
        <div class="val cost-val" data-amt="${totalFiltered}">${pricesVisible?fmtMoney(totalFiltered):'••••••'}</div>
        <div style="font-size:10px; color:var(--muted); margin-top:4px;">${pricesVisible?'':'Tap to reveal'}</div>
      </div>
    </div>
    <div class="section-title">Category</div>
    <div class="chips">
      <div class="chip ${expenseFilter==='all'?'active':''}" onclick="setExpenseFilter('all')">All</div>
      <div class="chip ${expenseFilter==='Daily Expense'?'active':''}" onclick="setExpenseFilter('Daily Expense')">Daily Expense</div>
      <div class="chip ${expenseFilter==='Shop Expense'?'active':''}" onclick="setExpenseFilter('Shop Expense')">Shop Expense</div>
    </div>
    <div class="section-title">Report Period</div>
    <div class="chips">
      <div class="chip ${expensePeriod==='all'?'active':''}" onclick="setExpensePeriod('all')">All Time</div>
      <div class="chip ${expensePeriod==='daily'?'active':''}" onclick="setExpensePeriod('daily')">Daily</div>
      <div class="chip ${expensePeriod==='weekly'?'active':''}" onclick="setExpensePeriod('weekly')">Weekly</div>
      <div class="chip ${expensePeriod==='monthly'?'active':''}" onclick="setExpensePeriod('monthly')">Monthly</div>
    </div>
    ${pickerHtml}
    <div id="expenseList" style="margin-top:14px"></div>
    <button class="primary" style="margin-top:6px" onclick="openExpenseModal()">+ Add Expense</button>
  `;
  document.getElementById('view').innerHTML = html;

  if(expensePeriod==='daily' || expensePeriod==='weekly'){
    document.getElementById('expenseDateInput').addEventListener('change', e=>{
      expenseReportDate = e.target.value; renderExpense();
    });
  } else if(expensePeriod==='monthly'){
    document.getElementById('expenseMonthInput').addEventListener('change', e=>{
      expenseReportMonth = e.target.value; renderExpense();
    });
  }

  const listEl = document.getElementById('expenseList');
  if(list.length===0){
    listEl.innerHTML = `<div class="empty">No expenses here.</div>`;
    return;
  }
  listEl.innerHTML = list.map(e=>`
    <div class="card">
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${e.description || e.category}</div>
          <div class="item-cat">${e.category}</div>
          <div class="item-prices">${e.date}</div>
        </div>
        <span class="badge low cost-val" data-amt="${e.amount}" style="cursor:pointer" onclick="togglePrices()">${pricesVisible?fmtMoney(e.amount):'••••'}</span>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="danger-text" onclick="deleteExpenseEntry('${e.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

/* ---------------- LOCAL BACKUP FOLDER MEMORY (File System Access API, desktop Chrome/Edge) ---------------- */
const FS_ACCESS_SUPPORTED = (typeof window!=='undefined' && 'showDirectoryPicker' in window);
function openHandleDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(APP_INSTANCE_ID+'-fs-handles', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function saveBackupFolderHandle(handle){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'backupFolder');
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.error(e); }
}
async function getSavedBackupFolderHandle(){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('backupFolder');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> resolve(null);
    });
  }catch(e){ return null; }
}
async function verifyDirPermission(handle){
  try{
    const opts = {mode:'readwrite'};
    let perm = await handle.queryPermission(opts);
    if(perm==='granted') return true;
    perm = await handle.requestPermission(opts);
    return perm==='granted';
  }catch(e){ return false; }
}
async function refreshBackupFolderStatus(){
  const el = document.getElementById('backupFolderStatus');
  if(!el) return;
  if(!FS_ACCESS_SUPPORTED){
    el.innerHTML = `Is device/browser par folder yaad rakhna support nahi hai — backup file hamesha Downloads mein jayegi.`;
    return;
  }
  const handle = await getSavedBackupFolderHandle();
  if(handle){
    el.innerHTML = `📁 Backup folder set: <b>${handle.name}</b> &nbsp;·&nbsp; <span style="color:var(--accent); cursor:pointer; font-weight:600;" onclick="changeBackupFolder()">Change</span>`;
  }else{
    el.innerHTML = `Koi folder set nahi — agli baar "Download Backup" dabane par location poochega aur yaad rakh lega.`;
  }
}
async function changeBackupFolder(){
  if(!FS_ACCESS_SUPPORTED){ showToast('Yeh device/browser folder memory support nahi karta'); return; }
  try{
    const dirHandle = await window.showDirectoryPicker();
    const ok = await verifyDirPermission(dirHandle);
    if(!ok){ showToast('Folder access allow nahi hua'); return; }
    await saveBackupFolderHandle(dirHandle);
    showToast('Backup folder set ✓');
    refreshBackupFolderStatus();
  }catch(e){
    if(e.name!=='AbortError') console.error(e);
  }
}

/* ---------------- BACKUP / RESTORE (JSON file — no cloud) ---------------- */
async function buildBackupObject(){
  let salesData = {};
  try{
    const all = await idbGetAll('sales');
    all.forEach(doc=>{ if(doc.list) salesData['sales:'+doc.date] = doc.list; });
  }catch(e){ console.error(e); }
  return {
    exportedAt: new Date().toISOString(),
    items, settings, partTypes, categories, subPartTypes, serviceSubTypes,
    creditEntries, shoppingList, shoppingCategories, expenseEntries, customers, repairJobs, suppliers,
    sales: salesData
  };
}
async function exportBackup(){
  showToast('Preparing backup...');
  const backup = await buildBackupObject();
  const json = JSON.stringify(backup, null, 2);
  const fileName = (settings.shopName || 'Asif Ali Auto Mobile Oil Shop')+' - Backup - '+todayStr()+'.json';

  if(FS_ACCESS_SUPPORTED){
    try{
      let dirHandle = await getSavedBackupFolderHandle();
      let hasPermission = dirHandle ? await verifyDirPermission(dirHandle) : false;
      if(!dirHandle || !hasPermission){
        dirHandle = await window.showDirectoryPicker();
        hasPermission = await verifyDirPermission(dirHandle);
        if(hasPermission) await saveBackupFolderHandle(dirHandle);
      }
      if(dirHandle && hasPermission){
        const fileHandle = await dirHandle.getFileHandle(fileName, {create:true});
        const writable = await fileHandle.createWritable();
        await writable.write(json);
        await writable.close();
        showToast('Backup saved to '+dirHandle.name+' ✓');
        if(document.getElementById('backupFolderStatus')) refreshBackupFolderStatus();
        return;
      }
    }catch(e){
      if(e.name==='AbortError'){ showToast('Backup cancelled'); return; }
      console.error(e);
    }
  }

  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded ✓');
}
async function handleRestoreFile(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    showToast('Invalid backup file');
    return;
  }
  openRestoreConfirmModal(data);
}
let pendingRestoreData = null;
function openRestoreConfirmModal(data){
  pendingRestoreData = data;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'restoreConfirmOverlay';
  const dateStr = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'unknown date';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Restore Backup?</h3>
      <p style="color:var(--muted); font-size:13.5px; margin-bottom:18px; line-height:1.7;">
        Yeh backup <b style="color:var(--text)">${dateStr}</b> ko export hui thi. Restore karne se current inventory, sales, categories aur settings replace ho jayenge. Yeh wapas nahi ho sakta.
      </p>
      <button class="primary" onclick="confirmRestore()">Yes, Restore Now</button>
      <button class="secondary" style="width:100%; margin-top:10px" onclick="document.getElementById('restoreConfirmOverlay').remove()">Cancel</button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
}
async function confirmRestore(){
  const data = pendingRestoreData;
  if(!data) return;
  try{
    if(data.items) { items = data.items; await saveItems(); }
    if(data.settings) { settings = data.settings; await saveSettings(); }
    if(data.partTypes) { partTypes = data.partTypes; await savePartTypes(); }
    if(data.categories) { categories = data.categories; await saveCategories(); }
    if(data.subPartTypes) { subPartTypes = data.subPartTypes; await saveSubPartTypes(); }
    if(data.serviceSubTypes) { serviceSubTypes = data.serviceSubTypes; await saveServiceSubTypes(); }
    if(data.customers) { customers = data.customers; await saveCustomers(); }
    if(data.repairJobs) { repairJobs = data.repairJobs; await saveRepairJobs(); }
    if(data.suppliers) { suppliers = data.suppliers; await saveSuppliers(); }
    if(data.creditEntries) { creditEntries = data.creditEntries; await saveCredit(); }
    if(data.expenseEntries) { expenseEntries = data.expenseEntries; await saveExpenses(); }
    if(data.shoppingList) { shoppingList = data.shoppingList; await saveShopping(); }
    if(data.shoppingCategories) { shoppingCategories = data.shoppingCategories; await saveShoppingCategories(); }
    if(data.sales){
      for(const key in data.sales){
        const date = key.replace('sales:','');
        await saveSales(date, data.sales[key]);
      }
    }
    document.getElementById('shopNameText').textContent = settings.shopName;
    document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
    showToast('Backup restored ✓');
    await switchView('dashboard');
  }catch(e){
    showToast('Restore failed, please try again');
  }
}

/* ---------------- PWA: SERVICE WORKER (installability + offline app shell) ----------------
   Note: this only registers when the app is opened over http(s) — a service
   worker (and the "Install App" prompt) never works when the file is opened
   directly by double-click (file:// in the address bar). Serve it via a
   local server or GitHub Pages to actually test installing it. */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=> console.log('Service worker registration failed', err));
  });
}

/* ---------------- CHIP DRAG-SCROLL (for mouse users on desktop) ---------------- */
let chipDrag = { active:false, el:null, startX:0, scrollLeft:0, moved:false };
document.addEventListener('mousedown', e=>{
  const chip = e.target.closest('.chips');
  if(!chip) return;
  chipDrag.active = true;
  chipDrag.el = chip;
  chipDrag.startX = e.pageX;
  chipDrag.scrollLeft = chip.scrollLeft;
  chipDrag.moved = false;
  chip.classList.add('dragging');
});
document.addEventListener('mousemove', e=>{
  if(!chipDrag.active) return;
  const dx = e.pageX - chipDrag.startX;
  if(Math.abs(dx) > 3) chipDrag.moved = true;
  chipDrag.el.scrollLeft = chipDrag.scrollLeft - dx;
});
function endChipDrag(){
  if(chipDrag.el) chipDrag.el.classList.remove('dragging');
  chipDrag.active = false;
  chipDrag.el = null;
}
document.addEventListener('mouseup', endChipDrag);
document.addEventListener('mouseleave', endChipDrag);
document.addEventListener('click', e=>{
  if(chipDrag.moved && e.target.closest('.chip')){
    e.stopPropagation();
    e.preventDefault();
  }
  chipDrag.moved = false;
}, true);
document.addEventListener('wheel', e=>{
  const chip = e.target.closest('.chips');
  if(!chip) return;
  if(chip.scrollWidth > chip.clientWidth){
    chip.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, {passive:false});

/* ---------------- INIT ---------------- */
(async function init(){
  loadSavedTheme();
  await Promise.all([
    loadItems(), loadSettings(), loadPartTypes(), loadSecurity(), loadCredit(),
    loadShopping(), loadShoppingCategories(), loadExpenses(), loadCategories(),
    loadSubPartTypes(), loadServiceSubTypes(), loadCustomers(), loadRepairJobs(), loadSuppliers()
  ]);

  // One-time default seeding — generic names, guarded so renamed
  // categories are never re-injected on later app loads.
  if(!settings.defaultsSeeded){
    if(!categories || categories.length===0){ categories = ['Category 1','Category 2']; await saveCategories(); }
    if(!partTypes || Object.keys(partTypes).length===0){
      partTypes = {}; categories.forEach(c=> partTypes[c] = []); await savePartTypes();
    }
    settings.defaultsSeeded = true;
    await saveSettings();
  }

  document.getElementById('shopNameText').textContent = settings.shopName;
  updateLockButtonVisibility();

  let savedRole = null;
  try{ savedRole = localStorage.getItem(APP_INSTANCE_ID+'-authRole'); }catch(e){}
  if(savedRole==='owner' || savedRole==='staff'){
    userRole = savedRole;
    applyRoleRestrictions();
    await switchView(userRole==='staff' ? 'inventory' : 'dashboard');
  } else if(security.passwordHash || security.staffPasswordHash){
    showLockScreen();
  } else {
    await switchView('dashboard');
  }
})();
</script>
