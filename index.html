<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asif Ali Auto Oil">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B1220'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23F2A93B'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Asif Ali Auto Mobile Oil Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0B1220;
    --surface:#141B2D;
    --surface2:#1C2740;
    --border:#26314A;
    --accent:#F2A93B;
    --accent-dim:#8a6a2c;
    --accent-text:var(--accent-text);
    --green:#3DDC97;
    --red:#F2555A;
    --text:#EAF0FB;
    --muted:#8593AD;
  }
  [data-theme="light"]{
    --bg:#F3F5F9;
    --surface:#FFFFFF;
    --surface2:#F0F2F7;
    --border:#DDE2EC;
    --accent:#D98A2B;
    --accent-dim:#B97A28;
    --accent-text:#FFFFFF;
    --green:#1FA971;
    --red:#D93A46;
    --text:#1A2233;
    --muted:#6B7280;
  }
  [data-theme="slate"]{
    --bg:#1B212C;
    --surface:#232B38;
    --surface2:#2B3444;
    --border:#3A4456;
    --accent:#5B9BD5;
    --accent-dim:#3F6E96;
    --accent-text:#0D1B26;
    --green:#4CC08D;
    --red:#E0616B;
    --text:#E8ECF2;
    --muted:#8A93A3;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; max-width:520px; margin:0 auto; position:relative;}

  header{
    padding:14px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  header .shopname{
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:19px; letter-spacing:0.3px;
    display:flex; align-items:center; gap:8px;
  }
  header .shopname .dot{width:8px;height:8px;border-radius:50%;background:var(--green); box-shadow:0 0 8px var(--green);}
  header button.icon-btn{
    background:none;border:none;color:var(--muted); padding:6px; cursor:pointer;
  }

  main{flex:1; overflow-y:auto; padding:16px 16px 90px;}

  .bottom-nav{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    padding:6px 6px;
    flex-shrink:0;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted); font-family:'Inter'; font-size:11px;
    padding:8px 2px; cursor:pointer; border-radius:10px; transition:.15s;
  }
  .nav-btn svg{width:20px;height:20px;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn.active svg{filter:drop-shadow(0 0 6px rgba(242,169,59,.5));}

  /* ---- Desktop / laptop layout (mobile stays exactly as-is below this width) ---- */
  @media (min-width:900px){
    body{ padding:24px; }
    #app{
      display:grid;
      grid-template-columns:230px 1fr;
      grid-template-rows:64px 1fr;
      grid-template-areas:
        "header header"
        "nav main";
      max-width:1200px;
      height:calc(100vh - 48px);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 25px 70px rgba(0,0,0,.55);
      border:1px solid var(--border);
    }
    header{ grid-area:header; }
    .bottom-nav{
      grid-area:nav;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      height:auto;
      border-bottom:none;
      border-right:1px solid var(--border);
      padding:18px 10px;
      gap:4px;
    }
    .nav-btn{
      flex-direction:row;
      justify-content:flex-start;
      gap:12px;
      padding:12px 14px;
      font-size:14px;
      border-radius:10px;
    }
    .nav-btn.active{ background:rgba(242,169,59,.1); }
    main{
      grid-area:main;
      max-width:760px;
      margin:0 auto;
      width:100%;
      padding:24px 32px 90px;
    }
    .fab{ display:none !important; }
  }

  /* Register display (signature element) */
  .register{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    gap:10px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .register::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:.6;
  }
  .reg-cell{flex:1; text-align:center;}
  .reg-cell .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; font-family:'Inter';}
  .reg-cell .val{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:26px;
  }
  .reg-cell.sale .val{color:var(--accent); text-shadow:0 0 14px rgba(242,169,59,.35);}
  .reg-cell.profit .val{color:var(--green); text-shadow:0 0 14px rgba(61,220,151,.35);}
  .reg-divider{width:1px; background:var(--border);}

  .section-title{
    font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:14px;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;
    margin:20px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
  }
  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .search-wrap{position:relative;}
  .search-wrap input{padding-right:44px;}
  .mic-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; border-radius:50%; border:none; padding:0;
    background:var(--border); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--muted);
  }
  .mic-btn svg{width:16px; height:16px;}
  .mic-btn.listening{
    background:var(--red); color:#fff;
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse{
    0%{box-shadow:0 0 0 0 rgba(255,70,70,.5);}
    70%{box-shadow:0 0 0 9px rgba(255,70,70,0);}
    100%{box-shadow:0 0 0 0 rgba(255,70,70,0);}
  }
  .item-info{flex:1; min-width:0;}
  .item-name{font-weight:600; font-size:15px; margin-bottom:3px;}
  .item-cat{font-size:11.5px; color:var(--muted);}
  .item-prices{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); margin-top:4px;}
  .item-prices b{color:var(--text);}
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.ok{background:rgba(61,220,151,.12); color:var(--green);}
  .badge.low{background:rgba(242,169,59,.12); color:var(--accent);}
  .badge.out{background:rgba(242,85,90,.12); color:var(--red);}

  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; cursor:grab; scrollbar-width:thin;}
  .chips.dragging{cursor:grabbing; user-select:none;}
  .chips::-webkit-scrollbar{height:5px;}
  .chips::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .chips::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:20px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-size:13px; font-weight:500; cursor:pointer;
  }
  .chip.active{background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600;}

  .empty{
    text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6;
  }

  button.primary{
    width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--accent); color:var(--accent-text); font-weight:700; font-size:15px;
    font-family:'Chakra Petch',sans-serif; letter-spacing:.3px; cursor:pointer;
  }
  button.secondary{
    padding:10px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-size:13px; cursor:pointer;
  }
  button.danger-text{background:none;border:none;color:var(--red); font-size:13px; cursor:pointer; padding:6px;}

  .fab{
    position:absolute; right:18px; bottom:calc(70px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%;
    background:var(--accent); color:var(--accent-text); border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 18px rgba(242,169,59,.4); cursor:pointer; z-index:5;
  }
  .fab svg{width:24px;height:24px;}

  input, select{
    width:100%; padding:12px 13px; border-radius:10px;
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-family:'Inter'; font-size:14.5px; margin-bottom:12px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px; font-weight:500;}

  .modal-overlay{
    position:absolute; inset:0; background:rgba(0,0,0,.6);
    display:flex; align-items:flex-end; z-index:20;
  }
  .modal{
    width:100%; background:var(--surface); border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{font-family:'Chakra Petch',sans-serif; font-size:17px; margin-bottom:16px;}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  .qty-stepper{display:flex; align-items:center; gap:14px; justify-content:center; margin:16px 0;}
  .qty-stepper button{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-size:20px; cursor:pointer;
  }
  .qty-stepper .qty-val{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; min-width:44px; text-align:center;}

  .sale-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .sale-list-item:last-child{border-bottom:none;}
  .sale-list-item .t{color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace;}

  .toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:var(--surface2); border:1px solid var(--accent); color:var(--text);
    padding:10px 18px; border-radius:10px; font-size:13.5px; z-index:50;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  ::-webkit-scrollbar{width:0;height:0;}
  main{ scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  main::-webkit-scrollbar{ width:9px; height:9px; }
  main::-webkit-scrollbar-track{ background:transparent; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  main::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
  .modal::-webkit-scrollbar{ width:9px; height:9px; }
  .modal::-webkit-scrollbar-track{ background:transparent; }
  .modal::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  .modal{ scrollbar-width:thin; scrollbar-color:var(--border) transparent; }

  #printReceiptArea{display:none;}
  @media print{
    @page{ size:A4; margin:0; }
    body > *:not(#printReceiptArea){display:none !important;}
    #printReceiptArea{display:block !important; padding:0; margin:0; color:#000; background:#fff;}
  }
</style>
</head>

  <main id="view"></main>

  <button class="fab" id="fabBtn" onclick="switchView('sale')" title="New Sale">

<script>
/* =========================================================================
   MY SHOP — fully offline clone (no Firebase, no GitHub sync)
   Built in parts. This is PART 1: Foundation & Storage Layer.

   Storage: everything lives in the browser's IndexedDB (database name set
   below via APP_INSTANCE_ID),
   replacing every Firebase call from the original Hassan Multimedia app with
   a local equivalent that has the SAME function name and SAME shape of data,
   so that future parts (Inventory, Sale, Reports, etc.) can be pasted in with
   almost no changes.
   ========================================================================= */

/* ---------------- INDEXEDDB CORE ---------------- */
/* =========================================================================
   PART 12 — REUSABILITY: one place to change per deployment.
   If you ever host TWO different shops' copies of this app under the SAME
   domain/GitHub username (e.g. yourname.github.io/shop-a/ and
   yourname.github.io/shop-b/), browsers treat that as the SAME storage
   origin — so their saved data would collide unless this ID is unique per
   shop. Change APP_INSTANCE_ID below to something unique (e.g. "myshop",
   "brothershop") before deploying a new copy for a different shop. See
   DEPLOYMENT_CHECKLIST.md for the full list of things to change.
   ========================================================================= */
const APP_INSTANCE_ID = 'asifaliauto';

const DB_NAME = APP_INSTANCE_ID + '-db';
const DB_VERSION = 1;
let _idb = null;
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(_idb) return resolve(_idb);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('shop')) d.createObjectStore('shop', {keyPath:'key'});
      if(!d.objectStoreNames.contains('items')) d.createObjectStore('items', {keyPath:'id'});
      if(!d.objectStoreNames.contains('sales')) d.createObjectStore('sales', {keyPath:'date'});
      if(!d.objectStoreNames.contains('invoices')) d.createObjectStore('invoices', {keyPath:'invoiceNumber'});
    };
    req.onsuccess = (e)=>{ _idb = e.target.result; resolve(_idb); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function idbGet(storeName, key){
  return idbOpen().then(d=> new Promise((resolve, reject)=>{
    const tx = d.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = (e)=> reject(e.target.error);
  }));
}
function idbGetAll(storeName){
  return idbOpen().then(d=> new Promise((resolve, reject)=>{
    const tx = d.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = (e)=> reject(e.target.error);
  }));
}
function idbPut(storeName, value){
  return idbOpen().then(d=> new Promise((resolve, reject)=>{
    const tx = d.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = (e)=> reject(e.target.error);
  }));
}
function idbDelete(storeName, key){
  return idbOpen().then(d=> new Promise((resolve, reject)=>{
    const tx = d.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = (e)=> reject(e.target.error);
  }));
}
function idbClearAndFill(storeName, arr){
  return idbOpen().then(d=> new Promise((resolve, reject)=>{
    const tx = d.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.clear();
    (arr||[]).forEach(item=> store.put(item));
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = (e)=> reject(e.target.error);
  }));
}
function idbPutMany(storeName, arr){
  if(!arr || !arr.length) return Promise.resolve(true);
  return idbOpen().then(d=> new Promise((resolve, reject)=>{
    const tx = d.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    arr.forEach(item=> store.put(item));
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = (e)=> reject(e.target.error);
  }));
}
// Kept so code pasted in from later parts (originally written for the cloud
// version) doesn't break if it still calls this — it's a no-op offline.
function scheduleAutoBackup(){}
function subscribeToSalesDate(date){}
function refreshCurrentView(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='inventory') renderInventory();
  else if(currentView==='sale') renderSale();
  else if(currentView==='report') renderReport();
  else if(currentView==='more') renderMore();
}

/* ---------------- CATEGORIES / PART TYPES / SUB TYPES ---------------- */
// Generic defaults on purpose — this app is meant to be reused for ANY shop.
// Nadeem (or a friend using their own copy) renames these from Settings /
// Manage Categories once the real feature screens are built in Part 2.
let categories = ['Category 1', 'Category 2'];
async function loadCategories(){
  try{
    const doc = await idbGet('shop', 'categories');
    if(doc && doc.value && doc.value.length){ categories = doc.value; return 'ok'; }
    return 'empty';
  }catch(e){ console.error(e); return 'error'; }
}
async function saveCategories(){
  try{ await idbPut('shop', {key:'categories', value: categories}); return true; }
  catch(e){ showToast('Save failed'); return false; }
}

let partTypes = { 'Category 1': [], 'Category 2': [] };
async function loadPartTypes(){
  try{

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function showLockScreen(){
  const overlay = document.createElement('div');
  overlay.id = 'lockOverlay';
  overlay.style.cssText = 'position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;';
  overlay.innerHTML = `
    <div style="width:100%; max-width:300px; text-align:center;">
      <div style="font-size:36px; margin-bottom:10px;">🔒</div>
      <div style="font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:19px; margin-bottom:6px;">${settings.shopName}</div>
      <p style="color:var(--muted); font-size:13px; margin-bottom:20px;">Enter password to continue</p>
      <input id="lockPasswordInput" type="password" placeholder="Password" style="text-align:center; font-size:16px;">
      <button class="primary" onclick="attemptUnlock()">Unlock</button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  const inp = document.getElementById('lockPasswordInput');
  inp.focus();
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') attemptUnlock(); });
}
async function attemptUnlock(){
  const val = document.getElementById('lockPasswordInput').value;
  const hash = await sha256(val);
  if(hash === security.passwordHash){
    userRole = 'owner';
    try{ localStorage.setItem(APP_INSTANCE_ID+'-authRole', 'owner'); }catch(e){}
    document.getElementById('lockOverlay').remove();
    applyRoleRestrictions();
    await switchView('dashboard');
  } else if(security.staffPasswordHash && hash === security.staffPasswordHash){
    userRole = 'staff';
    try{ localStorage.setItem(APP_INSTANCE_ID+'-authRole', 'staff'); }catch(e){}
    document.getElementById('lockOverlay').remove();
    applyRoleRestrictions();
    await switchView('inventory');
  } else {
    showToast('Wrong password, try again');
    document.getElementById('lockPasswordInput').value='';
    document.getElementById('lockPasswordInput').focus();
  }
}
function lockApp(){
  document.getElementById('view').innerHTML = '';
  showLockScreen();
}
function forgetDevice(){

async function renameCategoryInSales(oldVal, newVal){
  try{
    const all = await idbGetAll('sales');
    for(const doc of all){
      if(!doc.list || !doc.list.length) continue;
      let changed = false;
      const updated = doc.list.map(s=>{
        if(s.category===oldVal){ changed = true; return {...s, category:newVal}; }

      if(changed) await idbPut('sales', {date: doc.date, list: updated});
    }

}

async function findOrCreateCustomer(name, phone){
  const trimmed = (name||'').trim();
  if(!trimmed) return null;
  let existing = customers.find(c=>c.name.toLowerCase()===trimmed.toLowerCase());
  if(existing){
    if(phone && !existing.phone) existing.phone = phone;
    await saveCustomers();
    return existing.id;
  }
  const newCustomer = {id:uid(), name:trimmed, phone:phone||'', createdDate:todayStr()};
  customers.push(newCustomer);
  await saveCustomers();
  return newCustomer.id;
}

      const checked = selectedSaleIds.has(s.id) ? 'checked' : '';

function renderDashSearchResults(){
  const box = document.getElementById('dashSearchResults');
  const q = dashboardSearch.trim().toLowerCase();
  if(!q){ box.innerHTML=''; return; }
  const qDigits = q.replace(/\D/g,'');

  const customerMatches = customers.filter(c=>{
    const nameMatch = fuzzyTextMatch(c.name, q);
    const phoneDigits = (c.phone||'').replace(/\D/g,'');
    const phoneMatch = qDigits.length>=3 && phoneDigits.includes(qDigits);
    return nameMatch || phoneMatch;
  });

  const itemMatches = items.filter(i=>{
    const nameMatch = fuzzyTextMatch(i.name, q);
    const modelMatch = (i.models||[]).some(m=>fuzzyTextMatch(m, q));
    return nameMatch || modelMatch;
  });

  if(customerMatches.length===0 && itemMatches.length===0){
    box.innerHTML = `<div class="empty" style="padding:20px">No item or customer found for "${dashboardSearch}".</div>`;
    return;
  }

  let html = '';

  if(customerMatches.length>0){
    html += `<div class="section-title">Customers</div><div class="card">` + customerMatches.map(c=>`
      <div class="item-row" style="padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer" onclick="openCustomerDetail('${c.id}')">
        <div class="item-info"><div class="item-name">${c.name}</div><div class="item-cat">${c.phone || 'No phone number'}</div></div>
        <span style="font-size:22px; color:var(--muted)">›</span>
      </div>`).join('') + '</div>';
  }

  if(itemMatches.length>0){
    html += `<div class="section-title">Items</div><div class="card">` + itemMatches.map(i=>{
      const badgeClass = i.qty===0?'out':(i.qty<=2?'low':'ok');
      const badgeText = i.qty===0?'Out':i.qty+' pcs';
      const catLabel = [i.category, i.partType, i.subPartType].filter(Boolean).join(' · ');
      const modelsHtml = (i.models&&i.models.length>0) ? `<div class="item-cat" style="margin-top:2px">Fits: ${highlightModels(i.models, q)}</div>` : '';
      return `<div style="padding:8px 0; border-bottom:1px solid var(--border)">
        <div class="item-row">
          <div class="item-info"><div class="item-name">${i.name}</div><div class="item-cat">${catLabel}</div>${modelsHtml}</div>

/* Fuzzy, word-order-independent search: "t90" matches "T-90", and "mouse t90 gaming"
   matches "Gaming Mouse T-90" regardless of word order, spacing, or hyphens. */
function fuzzyTextMatch(text, query){
  if(!query) return true;
  const norm = s => s.toLowerCase().replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();
  const normText = norm(text);
  const normTextTight = normText.replace(/ /g,'');
  const normQuery = norm(query);
  const queryTight = normQuery.replace(/ /g,'');
  if(!queryTight) return true;
  if(normTextTight.includes(queryTight)) return true;
  const queryWords = normQuery.split(' ').filter(Boolean);
  if(queryWords.length>1){
    return queryWords.every(w => normTextTight.includes(w.replace(/ /g,'')));
  }
  return false;
}
function highlightModels(models, query){
  if(!query) return models.join(', ');
  const q = query.trim().toLowerCase();
  if(!q) return models.join(', ');

    if(m.toLowerCase().includes(q)){
      return `<span style="background:var(--accent); color:var(--accent-text); padding:1px 6px; border-radius:5px; font-weight:700;">${m}</span>`;
    }
    return m;
  }).join(', ');
}

   Each item keeps its own purchaseHistory[] (who it was bought from, at what
   rate, how much, and when) — logged automatically from the item form
   whenever a seller name is typed. The Sellers screen (via More) rolls this

function getAllSellerNames(){
  const names = new Set(suppliers.map(s=>s.name));

  if(!item.purchaseHistory || item.purchaseHistory.length===0) return null;

let activeRecognition = null;
function startVoiceSearch(target){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){ showToast('Voice search not supported on this browser'); return; }
  if(activeRecognition){ try{ activeRecognition.abort(); }catch(e){} activeRecognition = null; return; }
  const micBtn = document.getElementById(target+'MicBtn');
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  activeRecognition = recognition;
  if(micBtn) micBtn.classList.add('listening');
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    const input = document.getElementById(target+'SearchInput');
    if(input){
      input.value = transcript;
      input.dispatchEvent(new Event('input'));
    }
  };
  recognition.onerror = (e)=>{
    if(e.error==='no-speech' || e.error==='aborted') return;
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      showToast('Mic blocked — allow microphone permission for this browser/page');
    } else if(e.error==='network'){
      showToast('Voice search needs internet — check your connection');
    } else {
      showToast('Voice search failed ('+e.error+') — try again');
    }
  };
  recognition.onend = ()=>{
    activeRecognition = null;
    const btn = document.getElementById(target+'MicBtn');
    if(btn) btn.classList.remove('listening');
  };
  try{ recognition.start(); }
  catch(e){ if(micBtn) micBtn.classList.remove('listening'); activeRecognition = null; }
}

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Invalid image'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

  if(newVal!==oldVal){
    categories[idx] = newVal;
    if(partTypes[oldVal]){ partTypes[newVal] = partTypes[oldVal]; delete partTypes[oldVal]; }
    Object.keys(subPartTypes).forEach(k=>{
      if(k.startsWith(oldVal+'::')){
        const newKey = newVal+'::'+k.split('::')[1];
        subPartTypes[newKey] = subPartTypes[k];
        delete subPartTypes[k];
      }
    });
    const changedItems = items.filter(it=>it.category===oldVal);
    changedItems.forEach(it=>{ it.category = newVal; });
    const ok1 = await saveCategories();
    const ok2 = await savePartTypes();
    const ok3 = await saveSubPartTypes();
    await saveItemsBatch(changedItems);

    if(ok1 && ok2 && ok3){

async function saveItemForm(id){
  const name = document.getElementById('f_name').value.trim();
  let cat = document.getElementById('f_cat').value;
  const parttypeSel = document.getElementById('f_parttype');
  let partType = parttypeSel ? parttypeSel.value : null;
  if(partType==='__add_new__' || partType==='') partType = null;
  const subtypeSel = document.getElementById('f_subtype');
  let subPartType = (subtypeSel && document.getElementById('subTypeWrap').style.display!=='none') ? subtypeSel.value : null;
  if(subPartType==='__add_new__' || subPartType==='') subPartType = null;
  const cost = parseFloat(document.getElementById('f_cost').value)||0;
  const sell = parseFloat(document.getElementById('f_sell').value)||0;
  const qty = parseInt(document.getElementById('f_qty').value)||0;
  const models = document.getElementById('f_models').value.split(/[,=]/).map(m=>m.trim()).filter(m=>m.length>0);
  const sellerName = document.getElementById('f_seller') ? document.getElementById('f_seller').value.trim() : '';
  const tagExistingStock = document.getElementById('f_seller_tag_existing') ? document.getElementById('f_seller_tag_existing').checked : false;
  if(!name){ showToast('Item name is required'); return; }

  let savedItem;
  if(id){
    const it = items.find(i=>i.id===id);
    const originalQty = it.qty||0;
    Object.assign(it, {name, category:cat, partType, subPartType, cost, sell, qty, models, image: pendingItemImage});
    if(sellerName){
      if(!it.purchaseHistory) it.purchaseHistory = [];
      const qtyAdded = qty - originalQty;
      if(qtyAdded>0){
        // Genuine restock — log only the newly added quantity as a fresh purchase
        it.purchaseHistory.push({sellerName, rate:cost, qty:qtyAdded, date: todayStr()});
      } else if(tagExistingStock && qty>0){
        // Retroactively tagging stock that was already sitting in inventory —
        // logs the full current quantity as having come from this seller.
        it.purchaseHistory.push({sellerName, rate:cost, qty:qty, date: todayStr()});
      }
    }
    savedItem = it;
  } else {
    savedItem = {id:uid(), name, category:cat, partType, subPartType, cost, sell, qty, models, image: pendingItemImage, purchaseHistory: []};
    if(sellerName && qty>0){
      savedItem.purchaseHistory.push({sellerName, rate:cost, qty, date: todayStr()});
    }
    items.push(savedItem);
  }
  // Add the seller to the Sellers list the moment a name is typed and saved —
  // independent of whether a purchase entry was logged this time.
  if(sellerName && !suppliers.find(s=>s.name.toLowerCase()===sellerName.toLowerCase())){
    suppliers.push({id:uid(), name:sellerName, phone:'', createdDate: todayStr()});
    await saveSuppliers();
  }
  await saveItem(savedItem);
  pendingItemImage = null;
  document.querySelector('.modal-overlay').remove();
  showToast(id ? 'Item updated' : 'Item added');
  refreshCurrentView();
}

function applyInvoiceDiscount(lineItems, discount){
  if(!discount || discount<=0) return;
  const subtotal = lineItems.reduce((s,li)=>s+li.totalSell, 0);
  if(subtotal<=0) return;
  let remaining = discount;
  lineItems.forEach((li, idx)=>{
    let share;
    if(idx===lineItems.length-1){ share = remaining; }
    else{ share = Math.round((li.totalSell/subtotal)*discount); remaining -= share; }
    share = Math.min(share, li.totalSell);
    li.totalSell -= share;
    li.totalProfit -= share;
  });
}
let invoicesCache = null;
async function saveInvoiceRecord(record){
  try{
    await idbPut('invoices', record);
    if(!invoicesCache) invoicesCache = [];
    const idx = invoicesCache.findIndex(i=>i.invoiceNumber===record.invoiceNumber);
    if(idx>-1) invoicesCache[idx] = record; else invoicesCache.unshift(record);
  }catch(e){ console.error(e); showToast('Invoice saved, but the searchable record failed to save'); }
}
async function loadInvoicesIfNeeded(){
  if(invoicesCache===null){
    try{ invoicesCache = (await idbGetAll('invoices')).sort((a,b)=> b.invoiceNumber - a.invoiceNumber); }
    catch(e){ console.error(e); invoicesCache = []; }
  }
}

  discount = discount || 0;
  advance = advance || 0;
  const subtotal = lineItems.reduce((s,li)=>s+li.totalSell, 0);
  const grandTotal = subtotal - discount;
  const rows = lineItems.map(li=>`

/* =========================================================================
   PART 6 — INVOICES (Print / WhatsApp / Share Image + searchable history)
   Every invoice generated (single sale, combined from Dashboard, or from a
   Bill Cart checkout) is saved as a record so it can be found, viewed,
   edited (customer info / discount) or deleted later from "More".
   ========================================================================= */
function formatPhoneForWhatsApp(phone){
  let digits = (phone||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.startsWith('0')) digits = '92'+digits.slice(1); // Pakistan: leading 0 -> country code 92
  else if(digits.startsWith('3') && digits.length===10) digits = '92'+digits;
  return digits;
}
function buildInvoiceWhatsAppText(invoiceNumber, dateStr, lineItems, discount, advance){
  discount = discount || 0;
  advance = advance || 0;
  const subtotal = lineItems.reduce((s,li)=>s+li.totalSell, 0);
  const grandTotal = subtotal - discount;
  const rows = lineItems.map(li=>`• ${li.name} x${li.qty} — ${fmtMoney(li.totalSell)}`).join('\n');
  const totalsBlock = advance>0
    ? `Total Bill: ${fmtMoney(grandTotal)}\nAdvance Paid: -${fmtMoney(advance)}\n*Balance Due: ${fmtMoney(Math.max(0,grandTotal-advance))}*\n\n_Please keep this receipt — bring it (or send someone with it) to collect the item._`
    : (discount>0
      ? `Subtotal: ${fmtMoney(subtotal)}\nDiscount: -${fmtMoney(discount)}\n*Grand Total: ${fmtMoney(grandTotal)}*`
      : `*Grand Total: ${fmtMoney(grandTotal)}*`);
  return `*${settings.shopName}*\nInvoice #${String(invoiceNumber).padStart(5,'0')}\nDate: ${dateStr}\n\n${rows}\n\n${totalsBlock}\n\nThank you for choosing ${settings.shopName}!`;
}
function sendInvoiceViaWhatsApp(invoiceNumber, dateStr, customerMobile, lineItems, discount, preOpenedTab, advance){
  const text = buildInvoiceWhatsAppText(invoiceNumber, dateStr, lineItems, discount, advance);
  const encoded = encodeURIComponent(text);
  const phone = formatPhoneForWhatsApp(customerMobile);
  const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
  if(preOpenedTab && !preOpenedTab.closed){
    preOpenedTab.location.href = url;
  } else {
    window.open(url, '_blank');
  }
  if(!phone) showToast('No customer number — pick a contact on WhatsApp to send to');
}
async function shareInvoiceAsImage(invoiceNumber, dateStr, customerName, customerMobile, lineItems, discount, advance){
  if(typeof html2canvas==='undefined'){ showToast('Image sharing is still loading — try again in a moment (needs internet the first time)'); return; }
  showToast('Preparing invoice image...');
  const invoiceLabel = `Invoice #${String(invoiceNumber).padStart(5,'0')}`;
  let container;
  try{
    const html = buildInvoiceHTML(invoiceNumber, dateStr, customerName, customerMobile, lineItems, discount, advance);
    container = document.createElement('div');
    container.style.cssText = 'position:fixed; left:-9999px; top:0; width:794px; background:#fff;';
    container.innerHTML = html;
    document.body.appendChild(container);
    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    document.body.removeChild(container); container = null;

    canvas.toBlob(async (blob)=>{
      if(!blob){ showToast('Could not create invoice image'); return; }
      const fileName = `${invoiceLabel}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          const fullText = buildInvoiceWhatsAppText(invoiceNumber, dateStr, lineItems, discount);
          await navigator.share({ files: [file], title: invoiceLabel, text: fullText });
        }catch(e){
          if(e.name!=='AbortError') showToast('Could not open share menu');
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast('Sharing not supported here — image downloaded, attach it manually');
      }
    }, 'image/png');
  }catch(e){
    console.error(e);
    if(container && container.parentNode) container.parentNode.removeChild(container);
    showToast('Could not create invoice image');
  }
}

async function generateInvoice(dateStr, saleId, action){
  action = action || 'print';
  const preOpenedTab = (action==='whatsapp') ? window.open('', '_blank') : null;
  const sales = await loadSales(dateStr);
  const s = sales.find(x=>x.id===saleId);
  if(!s){ showToast('Sale not found'); if(preOpenedTab && !preOpenedTab.closed) preOpenedTab.close(); return; }
  const customerName = document.getElementById('inv_customer_name').value.trim();
  const customerMobile = document.getElementById('inv_customer_mobile').value.trim();

  if(!s.invoiceNumber){
    if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
    s.invoiceNumber = settings.nextInvoiceNumber;
    settings.nextInvoiceNumber += 1;
    await saveSettings();
  }
  if(customerName) s.customerName = customerName;
  if(customerMobile) s.customerMobile = customerMobile;
  const discount = parseFloat(document.getElementById('inv_discount')?.value)||0;
  const originalLineItems = [{...s}];
  applyInvoiceDiscount([s], discount);
  await saveSales(dateStr, sales);

  const subtotal = originalLineItems.reduce((sum,li)=>sum+li.totalSell, 0);
  await saveInvoiceRecord({
    invoiceNumber: s.invoiceNumber, date: dateStr,
    customerName: s.customerName||'', customerMobile: s.customerMobile||'', customerId: s.customerId||null,
    items: originalLineItems, subtotal, discount, grandTotal: subtotal-discount,
    saleRefs: [{date: dateStr, id: saleId}], createdAt: new Date().toISOString()
  });

  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();

  if(action==='whatsapp'){
    sendInvoiceViaWhatsApp(s.invoiceNumber, dateStr, s.customerMobile, originalLineItems, discount, preOpenedTab);
  } else if(action==='shareimage'){
    shareInvoiceAsImage(s.invoiceNumber, dateStr, s.customerName, s.customerMobile, originalLineItems, discount);
  } else {
    printInvoice(s.invoiceNumber, dateStr, s.customerName, s.customerMobile, originalLineItems, discount);
  }
  if(currentView==='dashboard') await renderDashboard();
}

async function saveInvoiceEdit(invoiceNumber){
  const inv = (invoicesCache||[]).find(i=>i.invoiceNumber===invoiceNumber);
  if(!inv) return;
  const newName = document.getElementById('ei_name').value.trim();
  const newMobile = document.getElementById('ei_mobile').value.trim();
  const newDiscount = parseFloat(document.getElementById('ei_discount').value)||0;

  const freshItems = inv.items.map(li=>({...li}));
  applyInvoiceDiscount(freshItems, newDiscount);
  const saleIdToItem = {};
  (inv.saleRefs||[]).forEach((r,idx)=>{ saleIdToItem[r.id] = freshItems[idx]; });

  const byDate = {};
  (inv.saleRefs||[]).forEach(r=>{ if(!byDate[r.date]) byDate[r.date]=[]; byDate[r.date].push(r.id); });
  for(const dateStr of Object.keys(byDate)){
    const sales = await loadSales(dateStr);
    let changed = false;
    sales.forEach(s=>{
      if(byDate[dateStr].includes(s.id)){
        const match = saleIdToItem[s.id];
        if(match){ s.totalSell = match.totalSell; s.totalProfit = match.totalProfit; }
        s.customerName = newName || null;
        s.customerMobile = newMobile || null;
        changed = true;
      }
    });
    if(changed) await saveSales(dateStr, sales);
  }

  inv.customerName = newName;
  inv.customerMobile = newMobile;
  inv.discount = newDiscount;
  inv.grandTotal = inv.subtotal - newDiscount;
  await saveInvoiceRecord(inv);

  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  showToast('Invoice updated ✓');
  renderInvoiceList();
  if(currentView==='dashboard') await renderDashboard();
}

async function deleteInvoiceRecord(invoiceNumber){
  const inv = (invoicesCache||[]).find(i=>i.invoiceNumber===invoiceNumber);
  if(!inv){ showToast('Invoice not found'); return; }
  const byDate = {};
  (inv.saleRefs||[]).forEach(r=>{ if(!byDate[r.date]) byDate[r.date]=[]; byDate[r.date].push(r.id); });
  const deletedIds = new Set((inv.saleRefs||[]).map(r=>r.id));

  for(const dateStr of Object.keys(byDate)){
    const sales = await loadSales(dateStr);
    const ids = byDate[dateStr];
    for(const s of sales){
      if(ids.includes(s.id) && s.itemId){
        const it = items.find(i=>i.id===s.itemId);
        if(it){ it.qty += s.qty; await saveItem(it); }
      }
    }
    const remaining = sales.filter(s=>!ids.includes(s.id));
    await saveSales(dateStr, remaining);
  }

  const beforeLen = creditEntries.length;
  creditEntries = creditEntries.filter(c=> !deletedIds.has(c.saleId) && c.saleId!=='bill-'+invoiceNumber);
  if(creditEntries.length!==beforeLen) await saveCredit();

  try{ await idbDelete('invoices', invoiceNumber); }catch(e){ console.error(e); }
  invoicesCache = (invoicesCache||[]).filter(i=>i.invoiceNumber!==invoiceNumber);

  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  showToast('Invoice deleted ✓ — stock restored');
  if(currentView==='invoices') renderInvoiceList();
  if(currentView==='dashboard') await renderDashboard();
}

function addServiceToBillCart(){

  const amount = parseFloat(document.getElementById('svc_amount').value)||0;

function setServicePaymentMethod(method){
  svcPaymentMethod = method;
  document.getElementById('svcPayCash').classList.toggle('active', method==='cash');
  document.getElementById('svcPayPartial').classList.toggle('active', method==='partial');
  document.getElementById('svcPayCredit').classList.toggle('active', method==='credit');
  document.getElementById('svcCreditNote').style.display = (method==='credit'||method==='partial') ? 'block' : 'none';
  document.getElementById('svcPartialWrap').style.display = method==='partial' ? 'block' : 'none';

function updateServicePartialPreview(){
  const amount = parseFloat(document.getElementById('svc_amount').value)||0;
  const qty = parseInt(document.getElementById('svc_qty').value)||1;
  const total = amount*qty;
  let cash = parseFloat(document.getElementById('svcPartialCash').value)||0;
  if(cash<0) cash=0;
  if(cash>total) cash=total;
  const remaining = total-cash;
  document.getElementById('svcPartialPreview').textContent = `Total: ${fmtMoney(total)} · Cash now: ${fmtMoney(cash)} · Udhaar (pending): ${fmtMoney(remaining)}`;
}
async function submitService(){
  const type = document.getElementById('svc_type').value;
  const customName = document.getElementById('svc_custom_name') ? document.getElementById('svc_custom_name').value.trim() : '';
  const subtypeSel = document.getElementById('svc_subtype');
  let subType = subtypeSel ? subtypeSel.value : '';
  if(subType==='__add_new__' || subType==='') subType = '';
  const partName = document.getElementById('svc_part_name') ? document.getElementById('svc_part_name').value.trim() : '';
  const partCost = document.getElementById('svc_part_cost') ? (parseFloat(document.getElementById('svc_part_cost').value)||0) : 0;
  const amount = parseFloat(document.getElementById('svc_amount').value)||0;
  const qty = parseInt(document.getElementById('svc_qty').value)||1;
  const customerName = document.getElementById('svc_customer_name') ? document.getElementById('svc_customer_name').value.trim() : '';
  const customerPhone = document.getElementById('svc_customer_phone') ? document.getElementById('svc_customer_phone').value.trim() : '';
  if(amount<=0){ showToast('Charge amount is required'); return; }

  const totalSell = amount*qty;
  let cashReceived = totalSell, creditAmount = 0;
  if(svcPaymentMethod==='credit'){
    cashReceived = 0; creditAmount = totalSell;
  } else if(svcPaymentMethod==='partial'){
    cashReceived = parseFloat(document.getElementById('svcPartialCash').value)||0;
    if(cashReceived<0) cashReceived = 0;
    if(cashReceived>totalSell) cashReceived = totalSell;
    creditAmount = totalSell - cashReceived;
  }
  if((svcPaymentMethod==='credit'||svcPaymentMethod==='partial') && !customerName){
    showToast('Customer name is required for Udhaar');
    return;
  }
  if(svcPaymentMethod==='partial' && creditAmount<=0){
    showToast('Enter an amount less than the total for Partial, or use Full Cash instead');
    return;
  }

  let name = (type==='Other Service' && customName) ? customName : type;
  if(subType) name = subType;
  if(partName) name = partName + ' (' + (subType || type) + ')';

  let customerId = null;
  if(customerName) customerId = await findOrCreateCustomer(customerName, customerPhone);

  const dateToUse = saleDate || todayStr();
  const sales = await loadSales(dateToUse);
  const now = new Date();
  const saleId = uid();
  sales.push({
    id: saleId, itemId: null, name,
    qty, unitCost: partCost, unitSell: amount,
    totalSell, totalProfit: (amount-partCost)*qty,
    time: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    isService: true, category: type, serviceSubType: subType||null, customerName: customerName||null, customerId,
    paymentMethod: svcPaymentMethod, cashReceived, creditAmount
  });
  await saveSales(dateToUse, sales);

  if(svcPaymentMethod==='credit' || svcPaymentMethod==='partial'){
    const desc = svcPaymentMethod==='partial'
      ? `Service — ${name} × ${qty} (Cash ${fmtMoney(cashReceived)} received, remaining on Udhaar)`
      : `Service — ${name} × ${qty}`;
    creditEntries.push({
      id:uid(), customer:customerName, description:desc,
      amount: creditAmount, paid:false, date:dateToUse, paidDate:null, payments:[], saleId
    });
    await saveCredit();
  }

  const msg = svcPaymentMethod==='credit' ? 'Added on Udhaar ✓' : (svcPaymentMethod==='partial' ? 'Added — partial Udhaar recorded ✓' : 'Added ✓');
  showToast(dateToUse===todayStr() ? msg : msg.replace('✓', `for ${dateToUse} ✓`));
  document.getElementById('svc_amount').value='';
  document.getElementById('svc_qty').value=1;
  if(document.getElementById('svc_part_name')) document.getElementById('svc_part_name').value='';
  if(document.getElementById('svc_part_cost')) document.getElementById('svc_part_cost').value='';
  if(document.getElementById('svc_customer_name')) document.getElementById('svc_customer_name').value='';
  if(document.getElementById('svc_customer_phone')) document.getElementById('svc_customer_phone').value='';
  setServicePaymentMethod('cash');
  if(document.getElementById('svcPartialCash')) document.getElementById('svcPartialCash').value=0;
  updateServiceProfitPreview();
}

/* ---------------- REPAIR JOBS TRACKING (separate drop-off tracker) ---------------- */
let repairFilter = 'pending';
async function renderRepairJobs(){
  let list = repairJobs;
  if(repairFilter==='pending') list = repairJobs.filter(j=>j.status==='pending');
  else if(repairFilter==='completed') list = repairJobs.filter(j=>j.status==='completed');
  list = list.slice().sort((a,b)=> (a.promisedDate||'').localeCompare(b.promisedDate||''));
  if(repairFilter==='completed') list = list.reverse();

  let html = `
    <button class="secondary" style="margin-bottom:14px" onclick="switchView('more')">← Back</button>
    <div class="chips">
      <div class="chip ${repairFilter==='pending'?'active':''}" onclick="setRepairFilter('pending')">Pending Pickup</div>
      <div class="chip ${repairFilter==='completed'?'active':''}" onclick="setRepairFilter('completed')">Delivered</div>
      <div class="chip ${repairFilter==='all'?'active':''}" onclick="setRepairFilter('all')">All</div>
    </div>
    <div id="repairListBody"></div>
    <button class="primary" style="margin-top:6px" onclick="openRepairJobModal()">+ Add Repair Job</button>
  `;
  document.getElementById('view').innerHTML = html;
  const listEl = document.getElementById('repairListBody');
  if(list.length===0){
    listEl.innerHTML = `<div class="empty">No repair jobs here.</div>`;
    return;
  }
  listEl.innerHTML = list.map(j=>{
    const advance = j.advance||0;
    const estimate = j.estimateCharges||j.charges||0;
    const remaining = Math.max(0, estimate - advance);
    return `
    <div class="card">
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${j.mobileModel}</div>
          <div class="item-cat">${j.customerName}${j.phone?' · '+j.phone:''}</div>
          ${j.note ? `<div class="item-cat" style="margin-top:2px">${j.note}</div>` : ''}
          <div class="item-prices">Promised: <b>${j.promisedDate}</b>${j.status==='completed'?' · Delivered on '+j.completedDate:''}</div>
          ${j.status==='pending' && (advance>0 || estimate>0) ? `<div class="item-prices" style="margin-top:4px;">${advance>0?`Advance: <b>${fmtMoney(advance)}</b>`:''}${advance>0 && estimate>0?' · ':''}${estimate>0?`Est: <b>${fmtMoney(estimate)}</b>`:''}${estimate>0?` · Remaining: <b style="color:var(--accent)">${fmtMoney(remaining)}</b>`:''}</div>` : ''}
        </div>
        <span class="badge ${j.status==='completed'?'ok':'low'}">${j.status==='completed'?'Delivered':(estimate>0?fmtMoney(estimate):'TBD')}</span>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        ${j.status==='pending' ? `<button class="secondary" style="flex:1" onclick="openDeliverRepairModal('${j.id}')">✓ Delivered &amp; Paid</button>` : ''}
        ${j.invoiceNumber ? `<button class="secondary" onclick="openInvoiceDetailModal(${j.invoiceNumber})">🧾 #${String(j.invoiceNumber).padStart(5,'0')}</button>` : ''}
        <button class="danger-text" onclick="deleteRepairJob('${j.id}')">Delete</button>
      </div>
    </div>
  `;}).join('');
}
function setRepairFilter(f){ repairFilter=f; renderRepairJobs(); }
function openRepairJobModal(){
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = tomorrow.getFullYear()+'-'+String(tomorrow.getMonth()+1).padStart(2,'0')+'-'+String(tomorrow.getDate()).padStart(2,'0');

      <button class="primary" onclick="saveRepairJob()">Add</button>

async function saveRepairJob(){
  const customerName = document.getElementById('rj_customer').value.trim();
  const phone = document.getElementById('rj_phone').value.trim();
  const mobileModel = document.getElementById('rj_model').value.trim();
  const note = document.getElementById('rj_note').value.trim();
  const promisedDate = document.getElementById('rj_date').value;
  const estimateCharges = parseFloat(document.getElementById('rj_estimate').value)||0;
  const advance = parseFloat(document.getElementById('rj_advance').value)||0;
  if(!customerName){ showToast('Customer name is required'); return; }
  if(!mobileModel){ showToast('Item / Device name is required'); return; }
  if(advance>0 && estimateCharges>0 && advance>estimateCharges){ showToast('Advance can\'t be more than the estimated charges'); return; }

  const customerId = await findOrCreateCustomer(customerName, phone);
  const jobId = uid();

  // Reserve an invoice number right away and print/send it as a deposit receipt —
  // showing the estimate, advance paid, and balance due. Whoever brings this receipt
  // (or quotes the invoice #) at pickup time can collect the item. The SAME invoice
  // number is reused and updated at delivery to become the final settled bill.
  if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
  const invoiceNumber = settings.nextInvoiceNumber;
  settings.nextInvoiceNumber += 1;
  await saveSettings();

  // Advance is tracked as a reminder only — it is NOT logged as a sale now. The full
  // bill (advance + remaining) is logged as one sale entry at delivery time, so that
  // day's sale total and profit stay in one place instead of being split across days.
  repairJobs.push({
    id: jobId, customerName, phone, mobileModel, note, promisedDate,
    estimateCharges, advance, charges: estimateCharges, invoiceNumber,
    status:'pending', createdDate: todayStr(), completedDate: null
  });
  await saveRepairJobs();

  await saveInvoiceRecord({
    invoiceNumber, date: todayStr(),
    customerName, customerMobile: phone, customerId,
    items: [{name: mobileModel + (note?' — '+note:''), qty:1, unitSell: estimateCharges, totalSell: estimateCharges}],
    subtotal: estimateCharges, discount: 0, grandTotal: estimateCharges, advance,
    saleRefs: [], repairJobId: jobId, createdAt: new Date().toISOString()
  });

  document.querySelector('.modal-overlay').remove();
  showToast(advance>0 ? 'Repair job added — advance noted (will be billed at delivery)' : 'Repair job added ✓');
  renderRepairJobs();
  openInvoiceDetailModal(invoiceNumber);
}
function openDeliverRepairModal(id){
  const j = repairJobs.find(x=>x.id===id);
  if(!j) return;
  const advance = j.advance||0;
  const estimate = j.estimateCharges||j.charges||0;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${j.customerName} — Deliver &amp; Collect Payment</h3>
      <p style="color:var(--muted); font-size:13px; margin-bottom:14px;">${j.mobileModel}${j.note?' — '+j.note:''}</p>
      ${advance>0 ? `<p style="color:var(--muted); font-size:13px; margin-bottom:10px;">Advance already in hand: <b style="color:var(--text)">${fmtMoney(advance)}</b> — include this in the total below.</p>` : ''}

      <p style="color:var(--muted); font-size:12px; margin:-8px 0 8px; line-height:1.6;">Enter the FULL amount for this repair (advance + balance). This whole amount is added to today's sale in one entry, so today's sale and profit are complete.</p>
      ${advance>0 ? `<p id="dr_balanceHint" style="color:var(--accent); font-size:12.5px; font-weight:600; margin:-4px 0 14px;"></p>` : ''}
      <button class="primary" onclick="confirmDeliverRepair('${id}')">Mark Delivered &amp; Add to Sale</button>

      document.getElementById('dr_balanceHint').textContent = `Balance to collect from customer today: ${fmtMoney(balance)}`;

async function confirmDeliverRepair(id){
  const j = repairJobs.find(x=>x.id===id);
  if(!j) return;
  const totalCharges = parseFloat(document.getElementById('dr_charges').value)||0;
  if(totalCharges<=0){ showToast('Enter the total bill amount'); return; }
  j.finalCharges = totalCharges;
  j.status = 'completed';
  j.completedDate = todayStr();
  await saveRepairJobs();

  // Log the FULL bill (advance + balance) as ONE sale entry on the delivery date —
  // keeps that day's sale total and profit complete and in one place.
  const customerId = await findOrCreateCustomer(j.customerName, j.phone);
  const dateToUse = todayStr();
  const sales = await loadSales(dateToUse);
  const now = new Date();
  const saleId = uid();
  sales.push({
    id: saleId, itemId: null, name: j.mobileModel + (j.note ? ' — '+j.note : ' — Repair'),
    qty: 1, unitCost: 0, unitSell: totalCharges,
    totalSell: totalCharges, totalProfit: totalCharges,
    time: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    isService: true, category: 'General Repair', customerName: j.customerName, customerId
  });
  await saveSales(dateToUse, sales);

  // Update the SAME invoice number that was handed to the customer as the deposit
  // receipt — it now becomes the final, fully-settled bill (no advance/balance split).
  if(j.invoiceNumber){
    await saveInvoiceRecord({
      invoiceNumber: j.invoiceNumber, date: dateToUse,
      customerName: j.customerName, customerMobile: j.phone, customerId,
      items: [{name: j.mobileModel + (j.note?' — '+j.note:''), qty:1, unitSell: totalCharges, totalSell: totalCharges}],
      subtotal: totalCharges, discount: 0, grandTotal: totalCharges, advance: 0,
      saleRefs: [{date: dateToUse, id: saleId}], repairJobId: j.id, createdAt: new Date().toISOString()
    });
  }

  const overlay = document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();
  showToast('Marked as delivered — full amount added to today\'s sale');
  renderRepairJobs();
  if(j.invoiceNumber) openInvoiceDetailModal(j.invoiceNumber);
}

function renderItemSale(){
  const cats = ['all', ...categories];
  let html = `
    <div class="search-wrap">
      <input id="saleSearchInput" placeholder="Search item or model" value="${saleItemSearch}" oninput="setSaleSearch(this.value)">
      <button type="button" class="mic-btn" id="saleMicBtn" onclick="startVoiceSearch('sale')" title="Search by voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><path d="M12 19v4M8 23h8"/></svg>
      </button>
    </div>
    <div class="chips" id="saleChips">${cats.map(c=>`<div class="chip ${saleFilter===c?'active':''}" onclick="setSaleFilter('${c}')">${c==='all'?'All':c}</div>`).join('')}</div>
    <div class="chips" id="salePartChips" style="${saleFilter!=='all'?'':'display:none'}"></div>
    <div class="chips" id="saleSubChips" style="${(saleFilter!=='all' && salePartTypeFilter!=='all')?'':'display:none'}"></div>
    <div id="saleList"></div>`;
  document.getElementById('saleModeBody').innerHTML = html;
  document.getElementById('saleSearchInput').focus();
  document.getElementById('saleSearchInput').selectionStart = document.getElementById('saleSearchInput').selectionEnd = saleItemSearch.length;

  const partChips = document.getElementById('salePartChips');
  const partCats = ['all', ...(partTypes[saleFilter]||[])];
  partChips.innerHTML = partCats.map(p=>`<div class="chip ${salePartTypeFilter===p?'active':''}" onclick="setSalePartFilter('${p}')">${p==='all'?'All':p}</div>`).join('');

  const subChips = document.getElementById('saleSubChips');
  const subCats = ['all', ...(subPartTypes[subPartKey(saleFilter, salePartTypeFilter)]||[])];
  subChips.innerHTML = subCats.map(p=>`<div class="chip ${saleSubTypeFilter===p?'active':''}" onclick="setSaleSubFilter('${p}')">${p==='all'?'All':p}</div>`).join('');

  const q = saleItemSearch.trim().toLowerCase();
  let list = items.filter(i=>{
    const catOk = saleFilter==='all' || i.category===saleFilter;
    if(!catOk) return false;
    if(saleFilter!=='all' && salePartTypeFilter!=='all' && i.partType!==salePartTypeFilter) return false;
    if(salePartTypeFilter!=='all' && saleSubTypeFilter!=='all' && i.subPartType!==saleSubTypeFilter) return false;
    if(!q) return true;
    const nameMatch = fuzzyTextMatch(i.name, q);
    const modelMatch = (i.models||[]).some(m=>fuzzyTextMatch(m, q));
    return nameMatch || modelMatch;
  });
  list = list.sort((a,b)=>(a.qty===0?1:0)-(b.qty===0?1:0));
  const listEl = document.getElementById('saleList');
  if(list.length===0){
    listEl.innerHTML = q ? `<div class="empty">No item found for "${saleItemSearch}".</div>` : `<div class="empty">No items found.<br>Add items in Inventory first.</div>`;
    return;
  }
  listEl.innerHTML = list.map(i=>{
    const reserved = billActive ? billCart.filter(c=>c.itemId===i.id).reduce((s,c)=>s+c.qty,0) : 0;
    const availableQty = i.qty - reserved;
    const disabled = availableQty<=0;
    const modelsHtml = (i.models&&i.models.length>0) ? `<div class="item-cat" style="margin-top:2px">Fits: ${highlightModels(i.models, q)}</div>` : '';
    const catLabel = [i.category, i.partType, i.subPartType].filter(Boolean).join(' · ');
    const btnLabel = billActive ? '➕ Add to Bill' : 'Sell';
    const btnAction = billActive ? `openAddToBillModal('${i.id}')` : `openSaleModal('${i.id}')`;
    return `<div class="card" style="${disabled?'opacity:.5':''}">
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${i.name}</div>
          <div class="item-cat">${catLabel} · ${fmtMoney(i.sell)}</div>
          ${modelsHtml}
        </div>
        <span class="badge ${availableQty===0?'out':(availableQty<=2?'low':'ok')}">${availableQty===0?'Out':availableQty+' pcs'}</span>
      </div>
      ${disabled ? '' : `<button class="secondary" style="width:100%; margin-top:10px" onclick="${btnAction}">${btnLabel}</button>`}
    </div>`;
  }).join('');
}

async function checkoutBill(action){
  action = action || 'print';
  const preOpenedTab = (action==='whatsapp') ? window.open('', '_blank') : null;
  const overlay = document.querySelector('.modal-overlay');
  const customerName = document.getElementById('bill_co_name').value.trim();
  const customerPhone = document.getElementById('bill_co_phone').value.trim();
  const paymentMethod = overlay.dataset.paymentMethod || 'cash';
  const discount = parseFloat(document.getElementById('bill_discount').value)||0;
  const subtotal = billCart.reduce((s,c)=>s+c.unitSell*c.qty,0);

  let cashReceived = subtotal, creditAmount = 0;
  if(paymentMethod==='credit'){
    cashReceived = 0; creditAmount = subtotal;
  } else if(paymentMethod==='partial'){
    cashReceived = parseFloat(document.getElementById('billPartialCash').value)||0;
    if(cashReceived<0) cashReceived = 0;
    if(cashReceived>subtotal) cashReceived = subtotal;
    creditAmount = subtotal - cashReceived;
  }
  if((paymentMethod==='credit'||paymentMethod==='partial') && !customerName){
    showToast('Customer name is required for Udhaar sales');
    if(preOpenedTab && !preOpenedTab.closed) preOpenedTab.close();
    return;
  }
  if(paymentMethod==='partial' && creditAmount<=0){
    showToast('Enter an amount less than the total for Partial, or use Full Cash instead');
    if(preOpenedTab && !preOpenedTab.closed) preOpenedTab.close();
    return;
  }

  if(!settings.nextInvoiceNumber) settings.nextInvoiceNumber = 1001;
  const invoiceNumber = settings.nextInvoiceNumber;
  settings.nextInvoiceNumber += 1;
  await saveSettings();

  let customerId = null;
  if(customerName) customerId = await findOrCreateCustomer(customerName, customerPhone);

  const dateToUse = saleDate || todayStr();
  const sales = await loadSales(dateToUse);
  const now = new Date();
  const timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  const newSaleEntries = [];
  for(const c of billCart){
    const it = items.find(i=>i.id===c.itemId);
    if(it){ it.qty -= c.qty; await saveItem(it); }
    const totalSell = c.unitSell*c.qty;
    const totalProfit = (c.unitSell-c.unitCost)*c.qty;
    const share = subtotal>0 ? totalSell/subtotal : 0;
    newSaleEntries.push({
      id: uid(), itemId: c.itemId, name: c.name, qty: c.qty,
      unitCost: c.unitCost, unitSell: c.unitSell,
      totalSell, totalProfit, time: timeStr,
      category: c.category, customerName: customerName||null, customerId,
      paymentMethod, cashReceived: Math.round(cashReceived*share), creditAmount: Math.round(creditAmount*share),
      invoiceNumber, isService: c.isService||false, serviceSubType: c.serviceSubType||null
    });
  }

  if(paymentMethod==='credit' || paymentMethod==='partial'){
    const desc = `Bill #${String(invoiceNumber).padStart(5,'0')} — ${billCart.length} item(s): ${billCart.map(c=>c.name).join(', ')}`;
    creditEntries.push({
      id:uid(), customer:customerName, description:desc,
      amount: creditAmount, paid:false, date:dateToUse, paidDate:null, payments:[],
      saleId: 'bill-'+invoiceNumber
    });
    await saveCredit();
  }

  const originalLineItems = newSaleEntries.map(s=>({...s})); // snapshot for invoice display, before discount mutation
  applyInvoiceDiscount(newSaleEntries, discount);
  sales.push(...newSaleEntries);
  await saveSales(dateToUse, sales);

  const subtotalForRecord = originalLineItems.reduce((sum,li)=>sum+li.totalSell, 0);
  await saveInvoiceRecord({
    invoiceNumber, date: dateToUse,
    customerName: customerName||'', customerMobile: customerPhone||'', customerId,
    items: originalLineItems, subtotal: subtotalForRecord, discount, grandTotal: subtotalForRecord-discount,
    saleRefs: originalLineItems.map(s=>({date: dateToUse, id: s.id})), createdAt: new Date().toISOString()
  });

  billActive = false;
  billCart = [];
  billCustomer = { name:'', phone:'' };
  overlay.remove();
  showToast('Bill saved ✓ — items added to today\'s sale');
  if(action==='whatsapp'){
    sendInvoiceViaWhatsApp(invoiceNumber, dateToUse, customerPhone, originalLineItems, discount, preOpenedTab);
  } else if(action==='shareimage'){
    shareInvoiceAsImage(invoiceNumber, dateToUse, customerName, customerPhone, originalLineItems, discount);
  } else {
    printInvoice(invoiceNumber, dateToUse, customerName, customerPhone, originalLineItems, discount);
  }
  switchView('dashboard');
}

async function confirmSale(id){
  const overlay = document.querySelector('.modal-overlay');
  const qty = parseInt(overlay.dataset.qty);
  const salePrice = parseFloat(document.getElementById('salePriceInput').value)||0;
  const customerNameInput = document.getElementById('saleCustomerName');
  const customerName = customerNameInput ? customerNameInput.value.trim() : '';
  const customerPhoneInput = document.getElementById('saleCustomerPhone');
  const customerPhone = customerPhoneInput ? customerPhoneInput.value.trim() : '';
  const paymentMethod = overlay.dataset.paymentMethod || 'cash';
  const totalSell = salePrice*qty;

  let cashReceived = totalSell, creditAmount = 0;
  if(paymentMethod==='credit'){
    cashReceived = 0; creditAmount = totalSell;
  } else if(paymentMethod==='partial'){
    cashReceived = parseFloat(document.getElementById('salePartialCash').value)||0;
    if(cashReceived<0) cashReceived = 0;
    if(cashReceived>totalSell) cashReceived = totalSell;
    creditAmount = totalSell - cashReceived;
  }
  if((paymentMethod==='credit'||paymentMethod==='partial') && !customerName){
    showToast('Customer name is required for Udhaar sales');
    return;
  }
  if(paymentMethod==='partial' && creditAmount<=0){
    showToast('Enter an amount less than the total for Partial, or use Full Cash instead');
    return;
  }

  const it = items.find(i=>i.id===id);
  it.qty -= qty;
  await saveItem(it);

  let customerId = null;
  if(customerName) customerId = await findOrCreateCustomer(customerName, customerPhone);

  const dateToUse = saleDate || todayStr();
  const sales = await loadSales(dateToUse);
  const now = new Date();
  const saleId = uid();
  sales.push({
    id: saleId, itemId: it.id, name: it.name, qty,
    unitCost: it.cost, unitSell: salePrice,
    totalSell, totalProfit: (salePrice-it.cost)*qty,
    time: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    category: it.category, customerName: customerName||null, customerId,
    paymentMethod, cashReceived, creditAmount
  });
  await saveSales(dateToUse, sales);

  if(paymentMethod==='credit' || paymentMethod==='partial'){
    const desc = paymentMethod==='partial'
      ? `Item Sale — ${it.name} × ${qty} (Cash ${fmtMoney(cashReceived)} received, remaining on Udhaar)`
      : `Item Sale — ${it.name} × ${qty}`;
    creditEntries.push({
      id:uid(), customer:customerName, description:desc,
      amount: creditAmount, paid:false, date:dateToUse, paidDate:null, payments:[], saleId
    });
    await saveCredit();
  }

  overlay.remove();
  const msg = paymentMethod==='credit' ? 'Sale added on Udhaar ✓' : (paymentMethod==='partial' ? 'Sale added — partial Udhaar recorded ✓' : 'Sale added ✓');
  showToast(dateToUse===todayStr() ? msg : msg.replace('✓', `for ${dateToUse} ✓`));
  renderSale();
}
